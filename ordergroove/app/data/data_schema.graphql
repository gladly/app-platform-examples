type Order @dataType(name: "ordergroove_order", version: "2.0") {
  """
  Merchant identifier associated with this order
  """
  merchant: String
  """
  Customer ID who placed this order
  """
  customer: String
  """
  Payment method ID used for this order
  """
  payment: String
  """
  Shipping address ID for order delivery
  """
  shipping_address: String
  """
  Order public ID
  """
  public_id: ID!
  """
  Currency code for this order (e.g., USD, EUR)
  """
  currency_code: String
  """
  Total tax amount applied to this order
  """
  tax_total: Currency
  """
  Total shipping cost for this order
  """
  shipping_total: Currency
  """
  Total discount amount applied to this order
  """
  discount_total: Currency
  """
  Final total amount for this order
  """
  total: Currency
  """
  Timestamp when order was created
  """
  created: DateTime
  """
  Timestamp when order was last updated
  """
  updated: DateTime
  """
  Scheduled or actual placement date; future date for unsent orders, past date for placed orders
  """
  place: DateTime
  """
  Timestamp when order was cancelled, null if not cancelled
  """
  cancelled: DateTime
  """
  Number of placement attempts made for this order
  """
  tries: Int
  """
  Count of generic errors encountered while processing this order
  """
  generic_error_count: Int
  """
  Current status of the order. Common statuses: UNSENT (future orders), SUCCESS (completed), PENDING_PLACEMENT (queued), CANCELLED (cancelled before processing).
  See: https://developer.ordergroove.com/reference/order-status-codes
  """
  status: OrderStatus
  """
  Order type classification
  """
  type: Int
  """
  Merchant's internal order identifier from the eCommerce platform
  """
  order_merchant_id: String
  """
  Error message if order was rejected
  """
  rejected_message: String
  """
  Additional custom data stored with this order
  """
  extra_data: String
  """
  Indicates if order is locked for processing
  """
  locked: Boolean
  """
  Indicates if out-of-stock items qualify for free shipping
  """
  oos_free_shipping: Boolean
  """
  Subscription ID that generated this order
  """
  subscriptionId: String!
  """
  Items included in this order
  """
  items: [Item] @parentId(template: "{{.public_id}}")
  """
  Order subtotal before tax, shipping and discounts. Ordergroove returns this on
  the order object; it was never mapped before 2.3.5, so the card could not show a
  pre-tax line.
  """
  sub_total: Currency
  """
  Card-safe camelCase twin of `public_id`. The flexible.card XSD forbids underscores in
  dataSource refs and the platform does NOT camelCase data-type fields at the card
  layer, so every field the card renders needs a twin emitted by the pull transform.
  """
  publicId: ID
  """
  Human-readable form of `status` - "Pending placement" rather than
  PENDING_PLACEMENT. The card expression language has `title` but no `replace`, so
  the readable twin is built in the pull.
  """
  statusLabel: String
  """
  Card-safe camelCase twin of `sub_total`.
  """
  subTotal: Currency
  """
  Card-safe camelCase twin of `tax_total`.
  """
  taxTotal: Currency
  """
  Card-safe camelCase twin of `shipping_total`.
  """
  shippingTotal: Currency
  """
  Card-safe camelCase twin of `discount_total`.
  """
  discountTotal: Currency
  """
  Card-safe camelCase twin of `currency_code`.
  """
  currencyCode: String
  """
  Card-safe camelCase twin of `order_merchant_id`.
  """
  orderMerchantId: String
  """
  Card-safe camelCase twin of `rejected_message`.
  """
  rejectedMessage: String
  """
  Card-safe camelCase twin of `shipping_address`.
  """
  shippingAddress: String
  """
  Placement attempt count as a String. A NumericValue binding forces two decimal
  places, so an Int renders as "2.00" on the card.
  """
  triesLabel: String
  """
  True when this order can still be acted on - not cancelled, not already placed.
  Drives which order-level actions the card offers.
  """
  isActionable: Boolean
  """
  Placement date formatted for display ("Sep 2, 2026"). The card expression language
  has no date formatting, so the readable form is built in the pull.
  """
  placeLabel: String
  """
  One-line order summary for the card's collapsed row - "Sep 2, 2026 - Success".
  Added in 2.3.5 so a year of weekly history reads as one line per order instead of six.
  """
  summaryLabel: String
  """
  Zero-based position of this order within its subscription, newest first. Ordergroove
  returns orders newest-first and supports no ordering param (verified live).
  """
  displayRank: Int
  """
  True for the newest few orders. The card renders only these by default; the rest stay
  in the payload for actions and order pickers. A DISPLAY cap - unrelated to the items
  fan-out cap, which bounds requests.
  """
  isRecent: Boolean

}

type Subscription @dataType(name: "ordergroove_subscription", version: "1.0") {
  """
  Customer ID who owns this subscription
  """
  customer: String
  """
  Merchant identifier associated with this subscription
  """
  merchant: String
  """
  Product ID for the subscribed product
  """
  product: String
  """
  Payment method ID used for recurring orders
  """
  payment: String
  """
  Shipping address ID for recurring orders
  """
  shipping_address: String
  """
  Offer ID linking incentive logic for recurring orders
  """
  offer: String
  """
  Type of subscription (e.g., standard, bundle, prepaid)
  """
  subscription_type: String
  """
  Bundle components for bundle subscriptions
  """
  components: [SubscriptionComponent]
  """
  Additional custom data stored with this subscription
  """
  extra_data: String
  """
  Subscription public ID
  """
  public_id: ID!
  """
  Product variant/attribute details
  """
  product_attribute: String
  """
  Quantity of product per recurring order
  """
  quantity: Int
  """
  Price per unit for this subscription
  """
  price: String
  """
  Number of days between each recurring order
  """
  frequency_days: Int
  """
  Number of days before order placement to send reminder
  """
  reminder_days: Int
  """
  Numeric value of frequency (used with every_period)
  """
  every: Int
  """
  Frequency period code. Mapping: 1=days, 2=weeks, 3=months, 4=years
  """
  every_period: Int
  """
  Date when subscription starts
  """
  start_date: DateTime
  """
  Timestamp when subscription was cancelled, null if active
  """
  cancelled: DateTime
  """
  Pipe-delimited cancel reason code and cancel reason details
  """
  cancel_reason: String
  """
  Cancellation reason code
  """
  cancel_reason_code: String
  """
  Currency code for this subscription (e.g., USD, EUR)
  """
  currency_code: String
  """
  Iteration identifier for rotating subscriptions
  """
  iteration: String
  """
  Sequence identifier for subscription ordering
  """
  sequence: String
  """
  Session ID associated with subscription creation
  """
  session_id: String
  """
  Merchant order ID that created this subscription
  """
  merchant_order_id: String
  """
  Customer service representative who managed this subscription
  """
  customer_rep: String
  """
  Club identifier for subscription clubs/memberships
  """
  club: String
  """
  Timestamp when subscription was created
  """
  created: DateTime
  """
  Timestamp when subscription was last updated
  """
  updated: DateTime
  """
  Whether subscription is active (live=true) or inactive (live=false)
  """
  live: Boolean
  """
  Prepaid subscription context data as JSON string
  """
  prepaid_subscription_context: String
  """
  Orders generated by this subscription
  """
  orders: [Order] @parentId(template: "{{.public_id}}")
  """
  Detailed product information
  """
  product_detail: Product @childIds(template: "{{.product}}")
  """
  Card-safe camelCase twin of `product_detail`. The flexible.card XSD forbids
  underscores in dataSource refs, so the card binds this one. Same resolver,
  same data.
  """
  productDetail: Product @childIds(template: "{{.product}}")
  """
  Card-safe camelCase twin of `public_id`. See Order.publicId for why twins exist.
  """
  publicId: ID
  """
  Finished title fallback - "Subscription <publicId>" - used when the product is missing
  from the products pull. Built in the pull because the card expression language's `+` is
  NUMERIC: concatenating there renders NaN. Only the fallback is built here, not the
  product name: the products pull depends on `ordergroove_subscription`, so it runs after
  this one and the name is not reachable.
  """
  fallbackTitleLabel: String
  """
  Human-readable subscription state - "Active" or "Cancelled" - derived from
  `live` and `cancelled` in the pull.
  """
  statusLabel: String
  """
  Human-readable cadence, e.g. "Every 2 months", derived from `every` +
  `every_period` in the pull. every_period mapping: 1=days, 2=weeks, 3=months,
  4=years.
  """
  cadenceLabel: String
  """
  Quantity as a String. A NumericValue binding forces two decimal places.
  """
  quantityLabel: String
  """
  True when this subscription is prepaid. Flattened out of
  `prepaid_subscription_context` in the pull because that field is declared String
  on this type and a structured object on the actions type - binding into it risks a
  null nested value, which blanks the ENTIRE card. Also gates
  changeSubscriptionQuantity and changeItemQuantity, both of which 400 on a prepaid
  subscription.
  """
  isPrepaid: Boolean
  """
  Prepaid shipments still owed, flattened out of `prepaid_subscription_context`.
  String, not Int, so the card does not render "2.00".
  """
  prepaidOrdersRemaining: String
  """
  Finished prepaid display string - "4 shipment(s) left". Built in the pull because the
  card expression language's `+` is NUMERIC: concatenating there renders NaN. Null when
  the prepaid context carries no remaining count; the card falls back to "Prepaid".
  """
  prepaidLabel: String
  """
  Human-readable prepaid renewal behaviour, flattened out of
  `prepaid_subscription_context`.
  """
  renewalBehaviorLabel: String
  """
  Card-safe camelCase twin of `subscription_type`.
  """
  subscriptionType: String
  """
  Card-safe camelCase twin of `frequency_days`.
  """
  frequencyDays: Int
  """
  Card-safe camelCase twin of `every_period`.
  """
  everyPeriod: Int
  """
  Card-safe camelCase twin of `start_date`.
  """
  startDate: DateTime
  """
  Card-safe camelCase twin of `cancel_reason`.
  """
  cancelReason: String
  """
  Card-safe camelCase twin of `cancel_reason_code`.
  """
  cancelReasonCode: String
  """
  Card-safe camelCase twin of `currency_code`.
  """
  currencyCode: String
  """
  Card-safe camelCase twin of `merchant_order_id`.
  """
  merchantOrderId: String
  """
  Card-safe camelCase twin of `shipping_address`.
  """
  shippingAddress: String
  """
  Card-safe camelCase twin of `product_attribute`.
  """
  productAttribute: String

}

