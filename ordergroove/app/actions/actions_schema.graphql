type Query {
  """
  Returns all subscriptions for a given Customer ID. The customer ID should match the customer's ID in the ecommerce platform.
  """
  getSubscriptionsByCustomerId(customerId: String!): [Subscription]
    @action(name: "getSubscriptionsByCustomerId")
  """
  Returns a single subscription by its subscription ID.
  """
  getSubscriptionById(subscriptionId: String!): Subscription
    @action(name: "getSubscriptionById")
  """
  Returns static list of standard and all available OrderGroove cancellation reasons, as well as all recorded reasons for cancellation per application
  """
  getCancellationReasons: CancellationReasonResponse
    @action(name: "getCancellationReasons")
  """
  Returns all items for a given order ID.
  """
  getOrderItems(orderId: String!): [OrderItem] @action(name: "getOrderItems")
  """
  Returns shipping address details by address ID.
  """
  getShippingAddress(addressId: String!): ShippingAddress
    @action(name: "getShippingAddress")
}

type Mutation {
  """
  Cancels a subscription by its subscription ID.
  """
  cancelSubscription(
    """
    The unique subscription ID to cancel
    """
    subscriptionId: String!
    """
    Cancellation reason code from standard or custom cancellation reasons
    """
    cancelReasonCode: String
    """
    Additional details about the cancellation reason
    """
    cancelReasonDetails: String
  ): Subscription @action(name: "cancelSubscription")
  """
  Reactivates a canceled/inactive subscription by its subscription ID.
  """
  reactivateSubscription(
    """
    The unique subscription ID to reactivate
    """
    subscriptionId: String!
    """
    Numeric value of frequency (e.g., 1 for "every 1 month", 2 for "every 2 weeks")
    """
    every: Int!
    """
    Frequency period code. Mapping: 1=days, 2=weeks, 3=months, 4=years
    """
    everyPeriod: Int!
    """
    Start date for the reactivated subscription in YYYY-MM-DD format
    """
    startDate: String!
  ): Subscription @action(name: "reactivateSubscription")
  """
  Skips the next order by removing all subscription items from the given order and rescheduling them for the following delivery cycle.

  This operation allows customers to skip their entire next scheduled order while keeping all subscriptions active.
  All subscription items in the order will be rescheduled for the next delivery cycle based on each subscription's frequency settings.

  Use cases:
  - Customer is traveling and wants to skip one delivery
  - Customer has excess inventory and wants to delay next shipment
  - Customer wants to adjust delivery timing without canceling subscriptions

  Returns the updated Order object after all subscription items have been removed and rescheduled.

  API Reference: https://developer.ordergroove.com/reference/skip-subscription
  """
  skipSubscription(
    """
    The unique identifier of the order containing the subscription to skip.
    This must be a valid public_id of an OrderGroove order that contains subscription items.
    """
    orderId: String!
    """
    The unique identifier of the subscription to skip within the order.
    This removes all items belonging to this subscription from the order and generates the next order for those items.
    """
    subscriptionId: String!
  ): Order @action(name: "skipSubscription")
  """
  Changes how often a subscription is delivered. Affects EVERY future order on this
  subscription, not just the next one. Does not move the next order date - use
  changeNextOrderDate for that.

  Use cases:
  - "I'm getting it too often" / "I want it more often"
  - Customer wants to stretch the cadence instead of cancelling (save lever)

  API Reference: https://developer.ordergroove.com/reference/subscriptions-change-frequency
  """
  changeSubscriptionFrequency(
    """
    The unique subscription ID (public_id) to change
    """
    subscriptionId: String!
    """
    Number of periods between orders, e.g. 2 with everyPeriod 3 is "every 2 months"
    """
    every: Int!
    """
    Frequency period code. Mapping: 1=days, 2=weeks, 3=months, 4=years
    """
    everyPeriod: Int!
  ): Subscription @action(name: "changeSubscriptionFrequency")
  """
  Changes how many units ship on a subscription. Affects EVERY future order on this
  subscription. To change just one upcoming order, use changeItemQuantity instead.

  Returns 400 on a prepaid subscription - check isPrepaid before offering this.

  Use cases:
  - "Send me two instead of one"
  - Customer wants to reduce quantity rather than cancel (save lever)

  API Reference: https://developer.ordergroove.com/reference/subscriptions-change-quantity
  """
  changeSubscriptionQuantity(
    """
    The unique subscription ID (public_id) to change
    """
    subscriptionId: String!
    """
    New number of units per order. Must be greater than zero.
    """
    quantity: Int!
  ): Subscription @action(name: "changeSubscriptionQuantity")
  """
  Moves the date of the next upcoming order on a subscription. Changes WHEN the next
  order is placed; it does not skip it, cancel it, or change the cadence.

  Note: the Subscription object carries no next-order-date field, so the response
  cannot echo the new date back. Confirm the requested date to the customer and tell
  them the card will show it once refreshed.

  Use cases:
  - "I'm away that week, can you push it back"
  - "I've run out early, can you bring it forward"

  API Reference: https://developer.ordergroove.com/reference/change-next-order-date
  """
  changeNextOrderDate(
    """
    The unique subscription ID (public_id) whose next order should move
    """
    subscriptionId: String!
    """
    New date for the next order, YYYY-MM-DD. Ordergroove expects a future date.
    """
    orderDate: String!
  ): Subscription @action(name: "changeNextOrderDate")
  """
  Changes what happens when a PREPAID subscription reaches the end of its prepaid
  term: autorenew, cancel, or downgrade to a standard subscription. Does not change
  the current term, refund anything, or affect orders already paid for.

  Returns 400 with "This subscription is not prepaid" on a standard subscription -
  check isPrepaid before offering this.

  Use cases:
  - "Don't auto-renew my prepaid plan when it ends"
  - "Switch me to regular billing after this term"

  API Reference: https://developer.ordergroove.com/reference/change-prepaid-subscription-renewal-behavior
  """
  changePrepaidRenewalBehavior(
    """
    The unique subscription ID (public_id) of the prepaid subscription
    """
    subscriptionId: String!
    """
    What to do at the end of the prepaid term. Exactly one of: autorenew, cancel,
    downgrade (case-sensitive).
    """
    renewalBehavior: String!
  ): Subscription @action(name: "changePrepaidRenewalBehavior")
  """
  Cancels ONE upcoming order. Does NOT cancel the subscription and does NOT stop
  billing - Ordergroove documents that "the subsequent order will be created based on
  its set frequency", so the next order still arrives on schedule. To stop a
  subscription entirely, use cancelSubscription. To move one delivery, use
  changeNextOrderDate; to skip one cycle, use skipSubscription.

  Use cases:
  - "I don't need this month's delivery" (subscription continues)
  - Duplicate or erroneous order needs removing

  API Reference: https://developer.ordergroove.com/reference/orders-cancel
  """
  cancelOrder(
    """
    The unique order ID (public_id) to cancel
    """
    orderId: String!
  ): Order @action(name: "cancelOrder")
  """
  Brings an upcoming order forward. This is NOT immediate dispatch: Ordergroove
  "sends an order to the merchant, setting order placement within a 24-hour window",
  so tell the customer it will be placed within 24 hours, never that it has shipped.
  The response confirms the request was accepted, not that the order was placed.

  Use cases:
  - "I've run out early, can you send the next one now"

  API Reference: https://developer.ordergroove.com/reference/orders-send-now
  """
  sendOrderNow(
    """
    The unique order ID (public_id) to place early
    """
    orderId: String!
  ): Order @action(name: "sendOrderNow")
  """
  Changes the quantity of ONE item on ONE upcoming order. Does NOT change the
  subscription - every future order keeps its existing quantity. To change the
  recurring quantity, use changeSubscriptionQuantity instead.

  Returns 400 on an item belonging to a prepaid subscription.

  Use cases:
  - "Just for this delivery, send me two"

  API Reference: https://developer.ordergroove.com/reference/items-change-quantity
  """
  changeItemQuantity(
    """
    The unique item ID (public_id) whose quantity should change
    """
    itemId: String!
    """
    New number of units for this one item. Must be greater than zero - to remove the
    item entirely use deleteOrderItem.
    """
    quantity: Int!
  ): OrderItem @action(name: "changeItemQuantity")
  """
  Removes ONE item from ONE upcoming order. Does NOT cancel the subscription that
  generated it - the item returns on the next order. This is irreversible for the
  current order: there is no undo.

  Ordergroove defines no response body for this endpoint, so the result is synthesised
  from the HTTP status and the card must be refreshed to confirm.

  Returns 400 on an item belonging to a prepaid subscription.

  Use cases:
  - "Take the conditioner off this order, I still have plenty"

  API Reference: https://developer.ordergroove.com/reference/items-delete
  """
  deleteOrderItem(
    """
    The unique item ID (public_id) to remove from the order
    """
    itemId: String!
  ): ItemDeletionResult @action(name: "deleteOrderItem")
  """
  Issues a one-time goodwill discount against ONE item or ONE order for this customer.
  This is the one thing in Ordergroove an agent can do that a customer cannot do for
  themselves, so it is the save lever to offer before cancelling.

  MONEY-MOVING AND GUARDED. All of the following are enforced in the action itself,
  not in the form, because Team Assist can call this action without rendering a form:
  - the merchant must have switched on "Enable one-time discounts" (off by default);
  - a maximum amount and/or percentage must be configured. An unset limit REFUSES that
    kind of discount - it never means unlimited;
  - the agent must tick the confirmation checkbox (`confirmed`), which defaults to off.

  Ordergroove provides NO idempotency key, so calling this twice issues two discounts.
  Confirm before retrying.

  The discount applies when the order places; the response confirms the incentive was
  created, not the final price the customer pays.

  API Reference: https://developer.ordergroove.com/reference/otd-create
  """
  issueOneTimeDiscount(
    """
    Ordergroove merchant ID. Read it from the subscription or order the agent is
    working on (both carry `merchant`).
    """
    merchantId: String!
    """
    Ordergroove customer ID - the `id` field on the customer record.
    """
    customerId: String!
    """
    Apply the discount to a single item. Mutually exclusive with orderId; supply
    exactly one.
    """
    itemId: String
    """
    Apply the discount to a whole order's subtotal. Mutually exclusive with itemId;
    supply exactly one.
    """
    orderId: String
    """
    Either "percent" or "amount".
    """
    discountType: String!
    """
    The value: 10 with type percent is 10% off; 5 with type amount is 5 off. Must be
    within the store's configured maximum or the action refuses.
    """
    value: String!
    """
    Why the discount was issued. Recorded on the incentive for later reporting.
    """
    reason: String
    """
    Optional longer description recorded against the incentive.
    """
    description: String
    """
    Must be true to issue the discount. Defaults to off in the form, so an omitted or
    false value refuses. Matches the confirmation idiom used by other money actions in
    this repo (see rise `issueStoreCredit`).
    """
    confirmed: Boolean
  ): OneTimeDiscount @action(name: "issueOneTimeDiscount")
}
