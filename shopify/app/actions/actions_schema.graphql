"""
A monetary value with currency.
""" # Equivalent to Shopify's `MoneyV2` type.
type Money {
  """
  Decimal money amount.
  """
  amount: Currency
  """
  Currency of the money.
  """
  currencyCode: String
}

"""
A collection of monetary values in their respective currencies.
""" # Equivalent to Shopify's `MoneyBag` type.
type MoneySet {
  """
  The amount in the shop's own currency. On an order billed in a local currency
  this is converted back from the local price, so it will not match the catalog
  price.
  """
  shopMoney: Money

  """
  The amount in the currency the customer was billed in. Equal to `shopMoney`
  when the market bills in the shop's currency.
  """
  presentmentMoney: Money
}

"""
A lightweight reference to a Shopify product.
"""
type ProductRef {
  id: ID!
  title: String!
}

"""
A lightweight reference to a Shopify product variant.
"""
type ProductVariantRef {
  id: ID!
  title: String!
}

"""
A lightweight reference to a Shopify collection — a group of products that merchants
organize to help customers browse and find related products.
"""
type CollectionRef {
  id: ID!
  title: String!
}

"""
A single line on an order — one line item per distinct product variant (catalog
lines) or one per custom (off-catalog) line.
"""
type LineItem {
  """
  A globally-unique line-item ID (`gid://shopify/LineItem/...`).
  """
  id: ID!
  """
  The display name of the line (product title plus variant title).
  """
  name: String
  """
  The per-unit price before discounts, in the shop's currency. Mapped from
  Shopify's `originalUnitPriceSet.shopMoney`.
  """
  price: Money
  """
  The product behind this line. Null for custom (off-catalog) lines, and absent
  from the email lookup (`look_up_orders_by_email`), which omits it.
  """
  product: ProductRef
  """
  Units ordered on this line.
  """
  quantity: Int
  """
  The SKU of the ordered variant. Null for custom lines and untracked items.
  """
  sku: String
  """
  Whether this line is the purchase of a gift card.
  """
  giftCard: Boolean
  """
  The total discount applied to this line, as a decimal string in the shop's
  currency. Mapped from Shopify's `totalDiscountSet.shopMoney.amount`.
  """
  totalDiscount: String
  """
  The specific product variant ordered (size/color/etc.). Use this to identify
  WHICH variant the customer bought. Null for custom (off-catalog) lines and for
  catalog lines whose variant has since been deleted, so always handle null.
  """
  variant: ProductVariantRef
  """
  The vendor / brand for this line.
  """
  vendor: String
}

"""
The shipping method the customer chose for an order.
"""
type ShippingLine {
  """
  The title of the shipping line, e.g. "Standard" or "International Shipping".
  """
  title: String!
}

type ParentTransaction {
  id: ID!
}

enum OrderTransactionKind {
  """
  An amount reserved against the cardholder's funding source. Money does not change hands until the authorization is captured.
  """
  AUTHORIZATION
  """
  A transfer of the money that was reserved by an authorization.
  """
  CAPTURE
  """
  The money returned to the customer when they've paid too much during a cash transaction.
  """
  CHANGE
  """
  An authorization for a payment taken with an EMV credit card reader.
  """
  EMV_AUTHORIZATION
  """
  A partial or full return of captured funds to the cardholder. A refund can happen only after a capture is processed.
  """
  REFUND
  """
  An authorization and capture performed together in a single step.
  """
  SALE
  """
  A suggested refund transaction that can be used to create a refund.
  """
  SUGGESTED_REFUND
  """
  A cancelation of an authorization transaction.
  """
  VOID
}

"""
A standardized error code, independent of the payment provider.
"""
enum OrderTransactionErrorCode {
  """
  The payment method was invalid.
  """
  AMAZON_PAYMENTS_INVALID_PAYMENT_METHOD

  """
  The maximum amount has been captured.
  """
  AMAZON_PAYMENTS_MAX_AMOUNT_CHARGED

  """
  The maximum amount has been refunded.
  """
  AMAZON_PAYMENTS_MAX_AMOUNT_REFUNDED

  """
  The maximum of 10 authorizations has been captured for an order.
  """
  AMAZON_PAYMENTS_MAX_AUTHORIZATIONS_CAPTURED

  """
  The maximum of 10 refunds has been processed for an order.
  """
  AMAZON_PAYMENTS_MAX_REFUNDS_PROCESSED

  """
  The order was canceled, which canceled all open authorizations.
  """
  AMAZON_PAYMENTS_ORDER_REFERENCE_CANCELED

  """
  The order was not confirmed within three hours.
  """
  AMAZON_PAYMENTS_STALE

  """
  Call the card issuer.
  """
  CALL_ISSUER

  """
  The card was declined.
  """
  CARD_DECLINED

  """
  There is an error in the gateway or merchant configuration.
  """
  CONFIG_ERROR

  """
  The card is expired.
  """
  EXPIRED_CARD

  """
  There was an unknown error with processing the payment.
  """
  GENERIC_ERROR

  """
  The address does not match the card number.
  """
  INCORRECT_ADDRESS

  """
  The CVC does not match the card number.
  """
  INCORRECT_CVC

  """
  The card number is incorrect.
  """
  INCORRECT_NUMBER

  """
  The entered PIN is incorrect.
  """
  INCORRECT_PIN

  """
  The ZIP or postal code does not match the card number.
  """
  INCORRECT_ZIP

  """
  The amount is either too high or too low for the provider.
  """
  INVALID_AMOUNT

  """
  The payment method is not available in the customer's country.
  """
  INVALID_COUNTRY

  """
  The format of the CVC is incorrect.
  """
  INVALID_CVC

  """
  The format of the expiry date is incorrect.
  """
  INVALID_EXPIRY_DATE

  """
  The format of the card number is incorrect.
  """
  INVALID_NUMBER

  """
  The payment method is momentarily unavailable.
  """
  PAYMENT_METHOD_UNAVAILABLE

  """
  The card has been reported as lost or stolen, and the card issuer has requested that the merchant keep the card and call the number on the back.
  """
  PICK_UP_CARD

  """
  There was an error while processing the payment.
  """
  PROCESSING_ERROR

  """
  A real card was used but the gateway was in test mode.
  """
  TEST_MODE_LIVE_CARD

  """
  The gateway or merchant configuration doesn't support a feature, such as network tokenization.
  """
  UNSUPPORTED_FEATURE
}

"""
The different states that an OrderTransaction can have.
"""
enum OrderTransactionStatus {
  """
  Awaiting a response.
  """
  AWAITING_RESPONSE

  """
  There was an error while processing the transaction.
  """
  ERROR

  """
  The transaction failed.
  """
  FAILURE

  """
  The transaction is pending.
  """
  PENDING

  """
  The transaction succeeded.
  """
  SUCCESS

  """
  The transaction status is unknown.
  """
  UNKNOWN
}

"""
A transaction associated with the order.
"""
type OrderTransaction {
  """
  A globally-unique ID.
  """
  id: ID!
  """
  The amount and currency of the transaction in shop and presentment currencies.
  """
  amountSet: MoneySet
  createdAt: DateTime
  kind: OrderTransactionKind
  status: OrderTransactionStatus
  gateway: String
  parentTransaction: ParentTransaction
  """
  A standardized error code, independent of the payment provider.
  """
  errorCode: OrderTransactionErrorCode
}

"""
The financial status of the order that can be shown to the merchant.
"""
enum OrderDisplayFinancialStatus {
  AUTHORIZED
  EXPIRED
  PAID
  PARTIALLY_PAID
  PARTIALLY_REFUNDED
  PENDING
  REFUNDED
  VOIDED
}

"""
Represents the order's aggregated fulfillment status for display purposes.
"""
enum OrderDisplayFulfillmentStatus {
  FULFILLED
  IN_PROGRESS
  ON_HOLD
  OPEN
  PARTIALLY_FULFILLED
  PENDING_FULFILLMENT
  REQUEST_DECLINED
  RESTOCKED
  SCHEDULED
  UNFULFILLED
}

"""
The reason provided when the order was canceled.
"""
enum ShopifyOrderCancelReason {
  CUSTOMER
  DECLINED
  FRAUD
  INVENTORY
  OTHER
  STAFF
}

enum FulfillmentHoldReason {
  """
  The fulfillment hold is applied because payment is pending.
  """
  AWAITING_PAYMENT
  """
  The fulfillment hold is applied because of return items not yet received during an exchange.
  """
  AWAITING_RETURN_ITEMS
  """
  The fulfillment hold is applied because of a high risk of fraud.
  """
  HIGH_RISK_OF_FRAUD
  """
  The fulfillment hold is applied because of an incorrect address.
  """
  INCORRECT_ADDRESS
  """
  The fulfillment hold is applied because inventory is out of stock.
  """
  INVENTORY_OUT_OF_STOCK
  """
  The fulfillment hold is applied because of a post-purchase upsell offer.
  """
  ONLINE_STORE_POST_PURCHASE_CROSS_SELL
  """
  The fulfillment hold is applied because of an unknown delivery date.
  """
  UNKNOWN_DELIVERY_DATE
  """
  The fulfillment hold is applied for another reason.
  """
  OTHER
}

"""
The validation status of a mailing address.
"""
enum MailingAddressValidationResult {
  """
  The address has been validated and is very likely to contain invalid information.
  """
  ERROR
  """
  The address has been validated and no issues were found.
  """
  NO_ISSUES
  """
  The address has been validated and might contain invalid information.
  """
  WARNING
}

"""
A physical mailing address. For example, a Customer's default address and an Order's billing address are both mailing addresses.
Stores standard address components, customer name information, and company details.

The address includes geographic coordinates (latitude and longitude).
"""
type MailingAddress {
  address1: String
  address2: String
  city: String
  company: String
  country: String
  countryCodeV2: String
  firstName: String
  lastName: String
  name: String
  phone: String
  province: String
  provinceCode: String
  zip: String
  """
  A formatted version of the address, including the customer's name and company.
  """
  formatted: [String!]
  """
  The validation status of the address.
  """
  validationResultSummary: MailingAddressValidationResult
  """
  Whether the address corresponds to recognized latitude and longitude values.
  """
  coordinatesValidated: Boolean
  """
  The approximate latitude of the address.
  """
  latitude: Float
  """
  The approximate longitude of the address.
  """
  longitude: Float
}

"""
A minimal reference to a customer of the shop.
"""
type CustomerInfo {
  id: ID!
  displayName: String
}

"""
A minimal overview of a customer including contact details.
"""
type CustomerSummary {
  id: ID!
  displayName: String

  """
  The email address of the customer.
  """
  email: String

  """
  The phone number of the customer.
  """
  phone: String

  """
  The customer's default address, formatted as multiple lines of text. Null when the customer has no default address.
  """
  defaultAddressFormatted: [String!]
}

enum MetafieldOwnerType {
  ARTICLE
  BLOG
  COLLECTION
  CUSTOMER
  DRAFTORDER
  LOCATION
  ORDER
  PAGE
  PRODUCT
  PRODUCTVARIANT
  SHOP
}

"""
Metafields enable you to attach additional information to a Shopify resource, such as a Product or a Collection.
Some examples of the data that metafields enable you to store are specifications, size charts, downloadable documents,
release dates, images, or part numbers. Metafields are identified by an owner resource, namespace, and key.
"""
type Metafield {
  id: ID!
  createdAt: DateTime!
  """
  The container for a group of metafields that the metafield is associated with.
  """
  namespace: String!
  """
  The unique identifier for the metafield within its namespace.
  """
  key: String!
  """
  The data stored in the metafield. Always stored as a string, regardless of the metafield's type.
  """
  value: String!
  """
  The type of data that is stored in the metafield.
  """
  type: String!
  """
  The ID of the resource that the metafield is attached to.
  """
  ownerId: ID!
  """
  The type of resource that the metafield is attached to.
  """
  ownerType: MetafieldOwnerType!
}

"""
A single order, as returned by both slim lookups — `look_up_order_by_order_num`
(single order) and `look_up_orders_by_email` (a list of these). Carries the order's
current state without payment-movement, returns, refunds, or holds detail; for that
use the deep `order_by_identifier` → `OrderDetail`.
"""
type Order {
  id: ID!
  confirmationNumber: String
  customer: CustomerInfo
  name: String!
  orderNumber: String!
  email: String
  currentSubtotalPriceSet: MoneySet
  currentTotalDiscountsSet: MoneySet
  currentTotalTaxSet: MoneySet
  currentTotalPriceSet: MoneySet
  cancelReason: ShopifyOrderCancelReason
  note: String
  tags: [String]
  createdAt: DateTime
  updatedAt: DateTime
  financialStatus: OrderDisplayFinancialStatus
  fulfillmentStatus: OrderDisplayFulfillmentStatus
  shippingAddress: MailingAddress
  """
  The shipping method the customer chose for their order (title only).
  """
  shippingLines: [ShippingLine]
  orderStatusUrl: String
  lineItems: [LineItem]
}

type ShopifyError {
  message: String!
  code: String
}

"""
A Shopify resource (Product, Order, Customer, Collection, etc.) together
with its metafields. Used as the per-owner row in `MetafieldsByOwnerIdResult`.
"""
type MetafieldOwner {
  """
  GID of the owning resource. Matches one of the input `ownerIds`.
  """
  id: ID!
  """
  The Shopify GraphQL type of the owning resource (e.g. `Product`, `Order`,
  `Customer`, `Collection`). Useful for callers that pass mixed owner ids.
  """
  typename: String!
  """
  Metafields attached to this owner. Empty owners are omitted from the result.
  """
  metafields: [Metafield!]!
}

"""
The result of fetching metafields for one or more owner GIDs.

Owners with no metafields are omitted from `owners`. Owner ids that Shopify
could not resolve appear in `errors` with `code: "not_found"`.
"""
type MetafieldsByOwnerIdResult {
  owners: [MetafieldOwner!]!
  errors: [ShopifyError!]
}

"""
The result of looking up a single order
"""
type OrderResult {
  order: Order
  """
  error message if the order is not found or there is an error
  """
  errors: [ShopifyError]
}

"""
The result of looking up orders by email — a list of slim orders (`Order`),
newest first.
"""
type OrdersResult {
  orders: [Order!]
  errors: [ShopifyError]
}

"""
The type of restock for the refunded line item.
"""
enum RefundLineItemRestockType {
  """
  The refund line item was canceled. Use this when restocking unfulfilled line items.
  """
  CANCEL
  """
  Deprecated. The refund line item was restocked, without specifically being identified as a return or cancelation. This value is not accepted when creating new refunds.
  """
  LEGACY_RESTOCK
  """
  Refund line item was not restocked.
  """
  NO_RESTOCK
  """
  The refund line item was returned. Use this when restocking line items that were fulfilled.
  """
  RETURN
}

# =============================================================================
# Deep-dive order read — types returned by `order_by_identifier`.
#
# `order_by_identifier` is the rich, single-order read keyed by GID (via Shopify's
# `orderByIdentifier(identifier: { id })`). Its output is a SEPARATE type family
# (`OrderDetail*`) from the slim `Order`/`LineItem` shapes — a slim read and a deep
# read MUST NOT share a response type (CLAUDE.md §2). A type's descriptions ARE the
# AI's tool docs, so if the slim reads returned the deep type, the slim action's tool
# docs would advertise deep-only fields it never populates — returns/refunds/holds,
# fulfillment-order lifecycle, and the per-line lifecycle quantities. The distinct
# `OrderDetail` family keeps the slim lookups' tool docs scoped to what they actually
# return. Shared value types (`Money`, `MoneySet`, `ProductVariantRef`, `ShopifyError`,
# the status enums, `RefundLineItemRestockType`) are reused as-is, since their shape is
# identical for both reads.
#
# Shape note for the AI: line items are a SINGLE FLAT LIST (`lineItems`). They are
# NOT grouped by fulfillment. The per-line quantity fields encode each line's
# lifecycle state, and the sibling blocks (`fulfillments`, `fulfillmentOrders`,
# `returns`, `refunds`) link back to lines by `lineItem.id` — see field docs below.
# =============================================================================

"""
Carrier tracking detail for a shipment. Each field is null when absent (often the whole block is empty even for a shipped fulfillment).
"""
type OrderDetailTrackingInfo {
  """
  The carrier / tracking company name (e.g. "UPS"). Null when unknown.
  """
  company: String
  """
  The tracking number. Null when unknown.
  """
  number: String
  """
  The tracking URL the customer can open. Null when unknown.
  """
  url: String
}

"""
A line within a shipment, keyed back to the order line by `lineItemId`.
"""
type OrderDetailFulfillmentLineItem {
  """
  Units of this order line included in the shipment.
  """
  quantity: Int
  """
  The `OrderDetailLineItem.id` this shipment line refers to.
  """
  lineItemId: ID
}

"""
A hold placed on a fulfillment order, explaining why fulfillment is paused.
"""
type OrderDetailFulfillmentHold {
  """
  The reason code for the hold, from Shopify's closed set of fulfillment-hold reasons.
  """
  reason: FulfillmentHoldReason
  """
  Free-text note elaborating on the hold, if the merchant supplied one.
  """
  reasonNotes: String
}

"""
A line within a fulfillment order, keyed back to the order line by `lineItemId`.
"""
type OrderDetailFulfillmentOrderLineItem {
  """
  Units of this order line still to be fulfilled by this fulfillment order.
  """
  remainingQuantity: Int
  """
  The `OrderDetailLineItem.id` this fulfillment-order line refers to.
  """
  lineItemId: ID
}

"""
A single line within a return, keyed back to the order line by `lineItemId`.
"""
type OrderDetailReturnLineItem {
  """
  Units of this line being returned.
  """
  quantity: Int
  """
  The return reason, e.g. "Too small" (mapped from `returnReasonDefinition.name`).
  Sourced from the current return-reason definition, NOT the deprecated `returnReason`
  scalar.
  """
  reason: String
  """
  Free-text note the customer or merchant attached to the return reason.
  """
  reasonNote: String
  """
  The `OrderDetailLineItem.id` being returned (via the return's fulfillment line item).
  """
  lineItemId: ID
}

"""
A single refunded line, keyed back to the order line by `lineItemId`. The
`restockType` distinguishes an order-edit removal (`CANCEL`) from a post-shipment
return (`RETURN`).
"""
type RefundLineItemOverview {
  """
  Units of this line that were refunded.
  """
  quantity: Int
  """
  The line subtotal refunded, after discounts.
  """
  subtotalSet: MoneySet
  """
  The tax refunded on this line.
  """
  totalTaxSet: MoneySet
  """
  How the refunded units were restocked: `CANCEL` (order-edit removal of unfulfilled
  units), `RETURN` (post-shipment return), or `NO_RESTOCK`.
  """
  restockType: RefundLineItemRestockType
  """
  The order line-item GID (`gid://shopify/LineItem/...`) that was refunded.
  """
  lineItemId: ID
}

"""
One option the customer chose on the ordered variant — a name/value pair such as
`Color` = `Black` or `Size` = `YM`. Every variant has at least one selected option;
a product with no real options reports a single synthetic option whose name is
`Title` and whose value is `Default Title`.
"""
type SelectedOption {
  """
  The option name, e.g. "Color" or "Size". "Title" for a no-option product.
  """
  name: String!
  """
  The chosen value for this option, e.g. "YM". "Default Title" for a no-option
  product. May itself contain " / " (e.g. a value like "Red / Large"), so don't
  try to split a variant title on " / " to recover options — read these instead.
  """
  value: String!
}

"""
The specific product variant ordered, for the deep order read. Beyond the variant's
`id` and `title`, it carries `selectedOptions` — the explicit option name/value pairs
the customer chose — so a consumer can identify exactly which variant was bought.
"""
type OrderDetailLineItemVariant {
  """
  A globally-unique variant ID (`gid://shopify/ProductVariant/...`).
  """
  id: ID!
  """
  The variant title, e.g. "Gray / YM". Option values joined by " / ".
  """
  title: String!
  """
  The option name/value pairs the customer chose (e.g. `Color`=`Gray`, `Size`=`YM`),
  one entry per product option in order. Always has at least one entry; a no-option
  product reports `[{ name: "Title", value: "Default Title" }]`. Read these rather
  than splitting `title`, since an option value can itself contain " / ".
  """
  selectedOptions: [SelectedOption!]!
}

"""
A lightweight reference to the product behind an order line item — its id, title,
vendor, and product type, enough to describe and disambiguate the item in a support
conversation. Null for custom (off-catalog) lines.
"""
type OrderDetailLineItemProduct {
  """
  A globally-unique product ID (`gid://shopify/Product/...`).
  """
  id: ID!
  """
  The product title, e.g. "Smith Squad Goggles".
  """
  title: String!
  """
  The product's vendor / brand.
  """
  vendor: String
  """
  The product category, e.g. "Goggles". Free-form merchant-defined string.
  """
  productType: String
  """
  The collections (both manual and automated/smart) this product belongs to, up to
  the first 50. Use a collection's `id` to scope a discount to this product's
  collection. Empty when the product is in no collection; absent on custom
  (off-catalog) lines (which have no product).
  """
  collections: [CollectionRef!]
  """
  True when the product belongs to more than the 50 collections fetched, so
  `collections` is truncated. False/absent when the full set was returned.
  """
  hasMoreCollections: Boolean
}

"""
A custom property. Attributes are used to store additional information about a
Shopify resource.

For example, a list of attributes might include whether a customer is a
first-time buyer, whether an order is
gift-wrapped, a preferred delivery date
(`"preferred_delivery_date": "2025-10-01"`), the discount applied, and any notes provided by the customer
(`"customer_notes": "Please leave at the front door"`).
"""
type Attribute {
  """
  The key or name of the attribute. For example, `"customer_first_order"`.
  """
  key: String!
  value: String
}

"""
A single line on the order. Lines are returned as one FLAT list on `OrderDetail`
(catalog and custom lines interleaved) — they are NOT grouped by fulfillment. Each
line's lifecycle state is encoded in its per-line quantity fields; the order's
`fulfillments` / `fulfillmentOrders` / `returns` / `refunds` blocks link back to
this line by its `id`.
"""
type OrderDetailLineItem {
  """
  A globally-unique line-item ID (`gid://shopify/LineItem/...`). This is the key
  that the `fulfillments`, `fulfillmentOrders`, `returns`, and `refunds` sibling
  blocks reference (as `lineItemId`) to point back to this line.
  """
  id: ID!
  """
  The display name of the line (product title plus variant title).
  """
  name: String
  """
  The line title (product title). Often equals `name` for single-variant products.
  """
  title: String
  """
  The specific product variant ordered (size/color/etc.), including the explicit
  `selectedOptions` the customer chose — use this to identify WHICH variant the
  customer bought for item-level actions. Null for custom (off-catalog) lines AND
  for catalog lines whose variant has since been deleted (e.g. a past-season
  variant), so always handle null.
  """
  variant: OrderDetailLineItemVariant
  """
  The product behind this line. Null for custom (off-catalog) lines.
  """
  product: OrderDetailLineItemProduct
  """
  The SKU of the ordered variant. Null for custom lines and untracked items.
  """
  sku: String
  """
  The vendor / brand for this line.
  """
  vendor: String
  """
  Whether this line is the purchase of a gift card.
  """
  giftCard: Boolean
  """
  The per-unit price before discounts (mapped from `originalUnitPriceSet.shopMoney`),
  in the shop's currency.
  """
  price: Money
  """
  The total discount applied to this line (mapped from `totalDiscountSet.shopMoney.amount`),
  as a decimal string in the shop's currency.
  """
  totalDiscount: String

  """
  Units originally ordered on this line.
  """
  quantity: Int
  """
  Units still on the order = ordered minus units removed via order-edit or refund. `0` ⇒ the
  line was fully removed or refunded, nothing left to act on. This is ALSO the count still
  **refundable** right now (ground-truthed equal to Shopify's `refundableQuantity` across order
  edits and partial refunds, 2026-06-19), and `quantity − currentQuantity` is the count that can
  no longer be fulfilled — so neither `refundableQuantity` nor `nonFulfillableQuantity` is carried
  (they're derivable from this + `quantity`).
  """
  currentQuantity: Int
  """
  Units not yet fulfilled. `> 0` ⇒ the line is still order-editable (you can change or
  remove it via an order edit). `0` ⇒ already fulfilled/shipped — use refund or return,
  not an order edit. Independent of `currentQuantity` (e.g. a refund lowers `currentQuantity`
  but not this; fulfilling lowers this but not `currentQuantity`).
  """
  unfulfilledQuantity: Int
  """
  A list of attributes that represent custom features or special requests.
  """
  customAttributes: [Attribute!]
}

"""
An actual shipment for the order — the "where is my order?" answer. Sibling block
on `OrderDetail`; its `lineItems` reference order lines by `lineItemId`.
"""
type OrderDetailFulfillment {
  """
  A globally-unique fulfillment ID.
  """
  id: ID!
  """
  Human-readable fulfillment reference, e.g. "#1056-F1".
  """
  name: String
  """
  The display status of the shipment, e.g. `IN_TRANSIT`, `DELIVERED`, `OUT_FOR_DELIVERY`,
  `LABEL_PRINTED`. Returned as a string.
  """
  displayStatus: String
  """
  The date and time the shipment was delivered. Null until delivered.
  """
  deliveredAt: DateTime
  """
  The carrier's current estimated arrival date/time for this shipment. This is the
  CARRIER estimate (what the carrier now says), distinct from the checkout-promise window
  on `fulfillmentOrders[].deliveryMethod` (`minDeliveryDateTime`/`maxDeliveryDateTime`,
  what was promised at checkout) — different sources, both may be present. Often null
  (e.g. manual fulfillments, or carriers that don't provide an estimate).
  """
  estimatedDeliveryAt: DateTime
  """
  Carrier tracking entries. Often EMPTY even for a fulfilled shipment — treat as
  optional, not a signal of fulfillment state.
  """
  trackingInfo: [OrderDetailTrackingInfo!]
  """
  Which order lines (and how many units) are in this shipment. Each entry's
  `lineItemId` matches an `OrderDetailLineItem.id`.
  """
  lineItems: [OrderDetailFulfillmentLineItem!]
}

"""
Possible delivery method types for a fulfillment order's delivery method
(Shopify's `DeliveryMethodType`).
"""
enum DeliveryMethodType {
  """
  The order is delivered using a local delivery service.
  """
  LOCAL
  """
  Non-physical items, no delivery needed.
  """
  NONE
  """
  The order is picked up by the customer.
  """
  PICK_UP
  """
  The order is delivered to a pickup point.
  """
  PICKUP_POINT
  """
  In-store sale, no delivery needed.
  """
  RETAIL
  """
  The order is shipped.
  """
  SHIPPING
}

"""
The delivery method selected for a fulfillment order: how it is delivered and, when
captured at checkout, the estimated arrival window.
"""
type OrderDetailDeliveryMethod {
  """
  How the order is delivered. The robust signal for distinguishing in-store/customer
  pickup (`PICK_UP`) from ship-to-home (`SHIPPING`) — don't infer it from the shipping
  line title.
  """
  methodType: DeliveryMethodType
  """
  The earliest estimated delivery date/time at the buyer's location. A checkout-time
  snapshot — NULL for admin/API/manual/pickup orders where no window was captured.
  """
  minDeliveryDateTime: DateTime
  """
  The latest estimated delivery date/time at the buyer's location. Null under the same
  conditions as `minDeliveryDateTime`.
  """
  maxDeliveryDateTime: DateTime
}

"""
A fulfillment OBLIGATION / routing record — NOT a shipment. This is the only block
that carries on-hold state. Sibling block on `OrderDetail`; an order's lines can
split across multiple fulfillment orders (so this is a flat list), and its
`lineItems` reference order lines by `lineItemId`.
"""
type OrderDetailFulfillmentOrder {
  """
  A globally-unique fulfillment-order ID.
  """
  id: ID!
  """
  The fulfillment-order status, e.g. `OPEN`, `IN_PROGRESS`, `ON_HOLD`, `SCHEDULED`,
  `INCOMPLETE`, `CLOSED`, `CANCELLED`. Returned as a string.
  """
  status: String
  """
  The name of the location assigned to fulfill these lines (e.g. "Main Warehouse").
  """
  assignedLocation: String
  """
  Active holds blocking fulfillment. NON-EMPTY only when the fulfillment order is
  held — this is the one fact no other block carries (use it to explain why an order
  hasn't shipped). Empty when not held.
  """
  holds: [OrderDetailFulfillmentHold!]
  """
  The lines this fulfillment order is responsible for, with how many units remain to
  fulfill. Each `lineItemId` matches an `OrderDetailLineItem.id`.
  """
  lineItems: [OrderDetailFulfillmentOrderLineItem!]
  """
  The delivery method for this fulfillment order — the robust ship-vs-pickup signal
  (`methodType`) plus the estimated delivery window. Null for orders with no delivery
  method (some manual/API/admin orders).
  """
  deliveryMethod: OrderDetailDeliveryMethod
}

"""
A return (RMA) against the order — the "is my return being processed?" answer.
Sibling block on `OrderDetail`; its `lineItems` reference order lines by `lineItemId`.
"""
type OrderDetailReturn {
  """
  A globally-unique return ID.
  """
  id: ID!
  """
  Human-readable return reference, e.g. "#1056-R1".
  """
  name: String
  """
  The return status, e.g. `OPEN`, `REQUESTED`, `CLOSED`, `DECLINED`, `CANCELED`.
  Returned as a string.
  """
  status: String
  """
  Total number of units across all lines in this return.
  """
  totalQuantity: Int
  """
  The individual lines being returned.
  """
  lineItems: [OrderDetailReturnLineItem!]
}

"""
A payment transaction that reimbursed part of a refund — the money that actually moved.
`kind` is `REFUND`; `gateway` / `formattedGateway` / `accountNumber` show where the money went
(e.g. back to a card, or to store credit).
"""
type RefundOrderTransaction {
  """
  A globally-unique transaction ID.
  """
  id: ID!
  """
  The kind of transaction; `REFUND` for a refund movement.
  """
  kind: OrderTransactionKind
  """
  Whether the transaction succeeded, e.g. `SUCCESS`, `PENDING`, `FAILURE`.
  """
  status: OrderTransactionStatus
  """
  The payment gateway that processed the transaction (machine name, e.g. "shopify_payments", "shopify_store_credit").
  """
  gateway: String
  """
  The human-readable payment gateway name, e.g. "Visa" or "Store credit".
  """
  formattedGateway: String
  """
  The masked account number of the payment method, e.g. "•••• 4242". Null or empty for gateways without one (e.g. store credit).
  """
  accountNumber: String
  """
  The amount reimbursed by this transaction, in shop and presentment currencies.
  """
  amountSet: MoneySet
}

"""
A refund issued against the order — the "was I refunded, and how?" answer: the refunded line
items and the payment transactions that moved the money (where it went). Lines reference order
lines by `lineItemId`.
"""
type RefundOverview {
  """
  A globally-unique refund ID.
  """
  id: ID!
  """
  The date and time when the refund was created.
  """
  createdAt: DateTime
  """
  The note recorded on the refund (Shopify's `Refund.note`). Null when none was recorded.
  """
  note: String
  """
  The total amount refunded, in shop and presentment currencies.
  """
  totalRefundedSet: MoneySet
  """
  The per-line refund detail.
  """
  lineItems: [RefundLineItemOverview!]
  """
  The payment transactions that reimbursed the refund — where the money went.
  """
  transactions: [RefundOrderTransaction!]
}

"""
An additional fee charged on the order on top of the line items — typically duties,
import, or handling charges. Informational for the agent (it explains an order total
that's higher than the sum of the line items); it is NOT a line item and carries no
quantity or fulfillment state.
"""
type AdditionalFee {
  """
  A globally-unique additional-fee ID.
  """
  id: ID!
  """
  The human-readable fee name, e.g. "Duties" or "Import fees".
  """
  name: String!
  """
  The fee amount, in shop and presentment currencies.
  """
  price: MoneySet
}

"""
A company that purchases via B2B orders or draft orders.
"""
type CompanyRef {
  """
  A globally-unique ID.
  """
  id: ID!

  """
  The name of the company.
  """
  name: String
}

"""
The company contact associated to the order or draft order.
"""
type CompanyContactRef {
  """
  A globally-unique ID.
  """
  id: ID!

  """
  The company contact's customer.
  """
  customer: CustomerInfo
}

"""
The company location associated to the order or draft order.
"""
type CompanyLocationRef {
  """
  A globally-unique ID.
  """
  id: ID!

  """
  The name of the company location.
  """
  name: String
}

"""
Represents information about the purchasing company for the order or draft order.
"""
type PurchasingCompanyRef {
  """
  The company associated to the order or draft order.
  """
  company: CompanyRef

  """
  The company contact associated to the order or draft order.
  """
  contact: CompanyContactRef

  """
  The company location associated to the order or draft order.
  """
  location: CompanyLocationRef
}

"""
Represents information about the purchasing entity for the order or draft order.
Exactly one of `customer` or `company` is set: `customer` for D2C purchases,
`company` for B2B purchases.
"""
type PurchasingEntity {
  """
  The customer associated to the order or draft order.
  """
  customer: CustomerSummary

  """
  The purchasing company associated to the order or draft order.
  """
  company: PurchasingCompanyRef
}

"""
The full deep-dive order detail returned by `order_by_identifier`. Carries order
header facts, totals, current-state payment rollups (`totalReceived`/`totalOutstanding`/
`totalRefunded`), addresses, a single flat `lineItems` list (with per-line quantity
state), and the `fulfillments` / `fulfillmentOrders` / `returns` / `refunds` sibling
blocks that link back to lines by `lineItem.id`. This is the read that drives
draft/replacement/refund/return/order-edit decisions.
"""
type OrderDetail {
  """
  A globally-unique order ID (`gid://shopify/Order/...`).
  """
  id: ID!
  """
  The human-readable order name, e.g. "#1057".
  """
  name: String
  """
  The order confirmation number shown to the customer. Distinct from `name`; use
  `name` to confirm the order with the customer.
  """
  confirmationNumber: String
  """
  The financial status of the order, e.g. `PAID`, `PARTIALLY_REFUNDED`, `REFUNDED`,
  `PENDING`. A routing/branching signal (e.g. is this refundable?).
  """
  displayFinancialStatus: OrderDisplayFinancialStatus
  """
  The aggregated fulfillment status of the order, e.g. `UNFULFILLED`, `FULFILLED`,
  `PARTIALLY_FULFILLED`, `ON_HOLD`. A routing/branching signal.
  """
  displayFulfillmentStatus: OrderDisplayFulfillmentStatus
  """
  The date and time the order was created.
  """
  createdAt: DateTime
  """
  The date and time when the order was processed. May differ from `createdAt`, for example, manual payments or imported orders.
  Is the timestamp Shopify uses for financial/reporting purposes: when the order’s money is treated as having been processed.
  """
  processedAt: DateTime
  """
  The sales channel the order was placed through, e.g. "Online Store" (from Shopify's
  `channelInformation.channelDefinition.channelName`). NULL when the order was created by
  an app, the admin, or a draft — then `sourceAppName` carries the origin. Kept SEPARATE
  from `sourceAppName` (never coalesced): the two together tell a real storefront channel
  from an app/admin/draft-created order.
  """
  salesChannelName: String
  """
  The application that created the order, e.g. "Online Store", "Point of Sale",
  "Draft Orders", or a custom app name (from Shopify's `app.name`). Especially meaningful
  when `salesChannelName` is null (app/admin/draft-created order).
  """
  sourceAppName: String
  """
  The human-readable delivery method the customer chose — the order-level shipping line
  title, e.g. "International Shipping", or the pickup location name for a pickup order
  ("My Custom Location"). NULL when the order has no shipping line (e.g. a digital order
  or some app/draft-created orders). This is the shipping-line title, NOT the carrier
  (`fulfillments[].trackingInfo.company`) or the fulfillment service. For the robust
  ship-vs-pickup signal use `fulfillmentOrders[].deliveryMethod.methodType`.
  """
  deliveryMethodName: String
  """
  The contact email on the order.
  """
  email: String
  """
  A staff/merchant note on the order.
  """
  note: String
  """
  The tags applied to the order.
  """
  tags: [String!]
  """
  The reason the order was canceled, if it was canceled.
  """
  cancelReason: ShopifyOrderCancelReason
  """
  The date and time the order was canceled. Null if not canceled.
  """
  cancelledAt: DateTime

  """
  The order total at the time it was placed. Unaffected by refunds, returns and
  order edits.
  """
  originalTotalPriceSet: MoneySet
  """
  Duties calculated when the order was placed, before any modifications.
  """
  originalTotalDutiesSet: MoneySet

  """
  Line items after both discount tiers, before returns and refunds. Includes tax
  when `taxesIncluded` is true.
  """
  subtotalPriceSet: MoneySet
  """
  Shipping charged, before any shipping refund.
  """
  totalShippingPriceSet: MoneySet
  """
  Tax on the order, before returns and refunds.
  """
  totalTaxSet: MoneySet
  """
  The order total before returns and refunds. Not fixed at creation: an order
  edit moves it. Only `originalTotalPriceSet` is fixed.
  """
  totalPriceSet: MoneySet

  """
  Line items after both discount tiers, and after returns and refunds. Includes
  tax when `taxesIncluded` is true.
  """
  currentSubtotalPriceSet: MoneySet
  """
  The total discounted on the order after returns and refunds. Includes both
  order-level and line-level discounts.
  """
  currentTotalDiscountsSet: MoneySet
  """
  The order-level discount only, after returns and refunds. Excludes line-level
  discounts, which `currentTotalDiscountsSet` includes. 0 rather than null when
  the order carries no order-level discount.
  """
  currentCartDiscountAmountSet: MoneySet
  """
  Shipping charged, after any shipping refund.
  """
  currentShippingPriceSet: MoneySet
  """
  Tax on the order after returns and refunds.
  """
  currentTotalTaxSet: MoneySet
  """
  Import duties owed, after returns and modifications. Duty refunding is not
  supported, so no per-line `Duty` data is exposed here.
  """
  currentTotalDutiesSet: MoneySet
  """
  What the order is worth now, after returns, refunds and edits.
  """
  currentTotalPriceSet: MoneySet

  """
  Money actually received (settled) on the order — answers "are they paid?" / "did the
  payment go through?". 0 while a payment is only pending. Current-state rollup (mirrors the
  admin "Paid" figure). Per-payment movement detail (when / who / partial payments) is the
  deferred order-history read, NOT this field.
  """
  totalReceived: MoneySet
  """
  Money refunded so far across the whole order — answers "was I refunded, and how much?".
  """
  totalRefunded: MoneySet
  """
  How much of the shipping charge was refunded. Part of `totalRefunded`, not
  additional to it.
  """
  totalRefundedShippingSet: MoneySet
  """
  Money still owed on the order — answers "how much is outstanding / still due?". 0 when
  fully paid (mirrors the admin "Balance due"). Positive favours the merchant, negative
  the customer. Not the order total minus what was paid — an over-refund written off as
  an adjustment leaves nothing outstanding.
  """
  totalOutstanding: MoneySet
  """
  How far the refunds actually issued departed from the amount Shopify suggested.
  Non-zero only when someone overrode it. Positive favours the merchant, negative the
  customer.
  """
  refundDiscrepancySet: MoneySet
  """
  Authorised payment not yet captured. Answers "how much can still be taken" on an order
  that is authorised but unpaid. Not adjusted for returns.
  """
  totalCapturableSet: MoneySet

  """
  The shipping address for the order — the shared `MailingAddress` (carries both the
  structured/coded fields for downstream action flows and `formatted` for read-back,
  plus `validationResultSummary`). Null when the order has none.
  """
  shippingAddress: MailingAddress
  """
  The billing address for the order — the shared `MailingAddress` (see `shippingAddress`).
  Null when the order has none.
  """
  billingAddress: MailingAddress

  """
  Who the order was placed for. For a D2C order, `customer` is set — its `id` is the
  `gid://shopify/Customer/...` you pass to `create_draft_order_for_customer` or to a
  store-credit refund, so a single order read yields the customer for downstream actions.
  For a B2B order, `company` is set instead (read the company, not `customer`, for
  attribution). Null for guest / unattributed orders (no customer or company on the order).
  """
  purchasingEntity: PurchasingEntity

  """
  All line items on the order as one FLAT list (catalog and custom interleaved),
  NOT grouped by fulfillment. Read each line's quantity fields for its state, and
  the sibling blocks for where/why. Up to 50 lines — check `hasMoreLineItems`.
  """
  lineItems: [OrderDetailLineItem!]
  """
  True when the order has more line items than the first 50 returned in `lineItems`.
  """
  hasMoreLineItems: Boolean
  """
  Actual shipments for the order — the "where is my order?" answer. Each entry's
  `lineItems` reference order lines by `lineItemId`.
  """
  fulfillments: [OrderDetailFulfillment!]
  """
  Fulfillment obligations / routing records — NOT shipments. The ONLY block carrying
  on-hold state. Lines may split across several entries; each references order lines
  by `lineItemId`. Up to 20 — check `hasMoreFulfillmentOrders`.
  """
  fulfillmentOrders: [OrderDetailFulfillmentOrder!]
  """
  True when the order has more fulfillment orders than the first 20 returned in `fulfillmentOrders`.
  """
  hasMoreFulfillmentOrders: Boolean
  """
  Returns (RMAs) against the order — "is my return being processed?". Each entry's
  `lineItems` reference order lines by `lineItemId`. Up to 20 — check `hasMoreReturns`.
  """
  returns: [OrderDetailReturn!]
  """
  True when the order has more returns than the first 20 returned in `returns`.
  """
  hasMoreReturns: Boolean
  """
  Refunds issued against the order — "was I refunded, and why?". Each entry's
  `lineItems` reference order lines by `lineItemId`; `restockType` distinguishes an
  order-edit removal from a post-shipment return.
  """
  refunds: [RefundOverview!]
  """
  Additional fees charged on the order (duties / import / handling) — separate from
  the line items. Informational: explains an order total above the line-item sum.
  Empty when the order has none.
  """
  additionalFees: [AdditionalFee!]
}

"""
The result of the `order_by_identifier` deep-dive read. On success `order` is
populated and `errors` is empty. When the GID resolves to no order, `order` is null
and `errors` contains a single `{ message: "Order is not found", code: "not_found" }`.
"""
type OrderDetailResult {
  """
  The full order detail, or null when the order is not found or an error occurred.
  """
  order: OrderDetail
  """
  Errors encountered, including the not-found case.
  """
  errors: [ShopifyError]
}

"""
The reason provided when canceling an order.
"""
enum CancelOrderReason {
  """
  The customer wanted to cancel the order.
  """
  CUSTOMER
  """
  Payment was declined.
  """
  DECLINED
  """
  The order was fraudulent.
  """
  FRAUD
  """
  There was insufficient inventory.
  """
  INVENTORY
  """
  The order was canceled for an unlisted reason.
  """
  OTHER
  """
  Staff made an error.
  """
  STAFF
}

type UserError {
  message: String!
  field: [String!]
}

enum OrderCancelUserErrorCode {
  """
  Unexpected internal error happened.
  """
  INTERNAL_ERROR
  """
  The input value is invalid.
  """
  INVALID
  """
  The record with the ID used as the input value couldn't be found.
  """
  NOT_FOUND
  """
  An order refund was requested but the user does not have the refund_orders permission.
  """
  NO_REFUND_PERMISSION
  """
  An order refund was requested but the user does not have the refund_to_store_credit permission.
  """
  NO_REFUND_TO_STORE_CREDIT_PERMISSION
  """
  A store credit order refund was requested but the order is a B2B order.
  """
  STORE_CREDIT_REFUND_B2B_NOT_SUPPORTED
  """
  A store credit order refund was requested but the expiration date is in the past.
  """
  STORE_CREDIT_REFUND_EXPIRATION_IN_PAST
  """
  A store credit order refund was requested but the order has no customer.
  """
  STORE_CREDIT_REFUND_MISSING_CUSTOMER
}

type OrderCancelUserError {
  message: String!
  code: OrderCancelUserErrorCode!
  field: String
}

type CancelOrderResult {
  """
  The ID of the job, used to track the status of internal operations.
  """
  jobId: ID
  """
  Indicates whether the job has been completed.
  """
  done: Boolean
  errors: [ShopifyError]
  """
  Input-level errors from the cancellation.
  """
  # Maps to the `orderCancelUserErrors` field on Shopify Admin API's `orderCancel` mutation.
  userErrors: [OrderCancelUserError]
}

type OrderCancelInformation {
  name: String!
  cancelledAt: DateTime
  cancelReason: ShopifyOrderCancelReason
  refunds: [RefundOverview!]
}

"""
Returns a Job resource by ID. Used to check the status of internal jobs and any applicable changes. (i.e. order cancellation)
"""
type JobStatus {
  """
  The ID of the job, used to track the status of internal operations.
  """
  id: ID
  """
  Indicates whether the job has been completed.
  """
  done: Boolean
  order: OrderCancelInformation
  errors: [ShopifyError]
  userErrors: [UserError]
}

"""
A transaction suggested to reimburse a refund, identifying the original payment and the amount to
refund against it. Suggested transactions are usually used in the context of refunds and exchanges.
"""
type SuggestedOrderTransaction {
  """
  The associated parent transaction, for example the authorization of a capture.
  """
  parentTransaction: ParentTransaction
  """
  The masked account number of the payment method, e.g. "•••• 4242". Null or empty for gateways without one (e.g. manual payments).
  """
  accountNumber: String
  """
  The payment gateway used to process the transaction (machine name, e.g. "shopify_payments").
  """
  gateway: String
  """
  The human-readable payment gateway name, e.g. "Visa" or "Manual".
  """
  formattedGateway: String
  """
  The amount of the suggested refund transaction, in shop and presentment currencies.
  """
  amountSet: MoneySet
}

"""
A line item included in a suggested refund.
"""
type SuggestedRefundLineItem {
  """
  The order line-item GID to refund (`gid://shopify/LineItem/...`).
  """
  lineItemId: ID!
  """
  The line display name (product title plus variant title).
  """
  name: String
  """
  The SKU of the line, when it has one.
  """
  sku: String
  """
  Units of this line to refund — the currently-refundable quantity.
  """
  quantity: Int!
  """
  The subtotal being refunded for this line, net of discounts, in shop and presentment currencies.
  """
  subtotalSet: MoneySet
}

"""
The shipping costs to be refunded on a suggested refund.
"""
type ShippingRefund {
  """
  The monetary value of the shipping fees to be refunded in shop and presentment currencies.
  """
  amountSet: MoneySet
  """
  The maximum amount of shipping fees currently refundable in shop and presentment currencies.
  """
  maximumRefundableSet: MoneySet
  """
  The monetary value of the tax allocated to shipping fees to be refunded in shop and presentment currencies.
  """
  taxSet: MoneySet
}

"""
A refund amount that Shopify suggests based on the line items and shipping costs being reimbursed.
Provides a breakdown of all monetary values — subtotals, taxes, and the maximum refundable amount —
in shop and presentment currencies, plus the line items to refund (with quantities) and the suggested
transactions to process the refund to the original payment method(s).
"""
type SuggestedRefund {
  """
  The amount that will actually be refunded — the refundable line items, tax, and
  shipping summed, in shop and presentment currencies. This is the authoritative
  figure: it is capped at what is still refundable on the order (only CAPTURED
  payments can be refunded), so on an unpaid or uncaptured order it is 0.00 even
  when `subtotalSet` and `totalTaxSet` still show the original line and tax amounts
  — those breakdown sums are NOT capped by captured payment. Read `amountSet`
  together with `suggestedTransactions` to decide what can be refunded, not the
  line subtotals.
  """
  amountSet: MoneySet
  """
  The maximum amount currently refundable on the order, in shop and presentment currencies. Equals `amountSet` when nothing has been refunded yet; lower once partial refunds exist.
  """
  maximumRefundableSet: MoneySet
  """
  The sum of the prices of the line items being refunded, in shop and presentment currencies.
  """
  subtotalSet: MoneySet
  """
  The sum of the taxes being refunded, in shop and presentment currencies.
  """
  totalTaxSet: MoneySet
  """
  The shipping costs to be refunded. Zero unless a shipping refund was requested.
  """
  shipping: ShippingRefund
  """
  The line items suggested for refund, limited to each line's currently-refundable units.
  """
  refundLineItems: [SuggestedRefundLineItem!]
  """
  The transactions suggested to reimburse the refund to the original payment method(s); one per tender, so multi-tender orders return several.
  """
  suggestedTransactions: [SuggestedOrderTransaction!]
}

type SuggestedRefundResult {
  errors: [ShopifyError]
  suggestedRefund: SuggestedRefund
}

"""
The method a refund amount is allocated to.
"""
enum RefundMethodAllocation {
  """
  The refund is returned to the customer's original payment method(s).
  """
  ORIGINAL_PAYMENT_METHODS
  """
  The refund is issued as store credit to the customer's store-credit account.
  """
  STORE_CREDIT
}

"""
A line item to refund — an order line and the number of units. Used by `suggestedRefund` to preview
specific lines (a partial refund) and by `refundOrder` to execute them.
"""
input RefundLineItemInput {
  """
  The order line-item GID (`gid://shopify/LineItem/...`).
  """
  lineItemId: ID!
