"""
The result of resolving file GIDs to URLs.

Every GID that resolved to a file appears in `files`, so `files` may be shorter
than the `ids` that were passed. A GID that did not resolve to a file appears in
`errors` with `code: "not_found"` — whether it resolved to nothing at all or to
something that isn't a file, such as an Order GID passed by mistake.
"""
type FilesByIdsResult {
  files: [ShopifyFile!]!
  errors: [ShopifyError!]
}

type Query {
  """
  Deep-dive read of a single order, by its globally-unique order GID. This is
  the rich, "everything you need to decide what to do next" view: order header
  (status, dates, email, note, tags), totals and money state, shipping/billing
  addresses, a flat list of line items with per-line quantity state, and sibling
  blocks for fulfillments, fulfillment orders, returns, and refunds. Use it to
  drive draft, replacement, refund, return, and order-edit decisions, and to
  identify exactly which product variant (size/color) was ordered for item-level
  actions.

  Line items are returned as a single flat list, not grouped by fulfillment.
  Each line's quantity fields encode its lifecycle (what's still orderable,
  shipped, refundable, or removed), and the fulfillment/return/refund sibling
  blocks link back to lines via `lineItem.id`. If the GID doesn't resolve to an
  order, `order` is null and `errors` contains a `not_found` entry.
  """
  orderByIdentifier(
    """
    The globally-unique order ID to read (`gid://shopify/Order/...`). Must be a GID;
    this action does not accept order numbers.
    """
    gid: ID!
  ): OrderDetailResult @action(name: "order_by_identifier")

  """
  Look up a single order by its order number.
  """
  lookupOrderByOrderNum(
    """
    The unique identifier for the order that appears on the order page in the Shopify admin and the Order status page. For example, '#1001', 'EN1001', or '1001-A'. This value isn't unique across multiple stores.
    """
    orderNum: String!
  ): OrderResult @action(name: "look_up_order_by_order_num")

  """
  Search orders by email address provided during checkout. Note this does not return orders for customers that have an account with this email address.
  Returns the most recent orders by creation date, newest first; the count is the integration's `ordersLimit` (default 10).
  """
  lookupOrdersByEmail(
    "The email address that's associated with the order."
    email: String!
  ): OrdersResult @action(name: "look_up_orders_by_email")

  """
  Check the status of an asynchronous job, such as an order cancellation.
  """
  jobStatus(
    "The ID of the job."
    jobId: ID!
    "The order ID related to the job."
    orderId: ID!
  ): JobStatus @action(name: "job_status")

  """
  Preview a refund for an order before one is issued: the amount to confirm with the customer, plus
  the suggested line items and payment transactions an actual refund can be generated from. By
  default (`suggestFullRefund: true`) it previews the WHOLE order — all currently-refundable line
  items; set `suggestFullRefund: false` with `refundLineItems` to preview specific lines.
  `refundShipping` is required and controls whether a full shipping refund is included — all shipping
  (true) or none (false); partial shipping amounts aren't supported. Amounts are given in both shop and
  presentment currencies.

  Refundable: order line items (the whole order or specific lines) and shipping, to the original
  payment method. Not refundable: duties and additional fees (not supported); and only CAPTURED
  amounts can be refunded — an authorized-but-uncaptured payment is cancelled via `cancel_order`,
  not refunded here.
  """
  suggestedRefund(
    "The order to preview a refund for, e.g. \"gid://shopify/Order/7462005375289\"."
    orderId: ID!
    "Specific lines to refund (partial refund). Ignored when `suggestFullRefund` is true; omit for a whole-order refund."
    refundLineItems: [RefundLineItemInput!]
    "When true (default), suggest a refund for ALL currently-refundable line items. When false, suggest for the given `refundLineItems`."
    suggestFullRefund: Boolean = true
    "Whether to include a full shipping refund. Required. Shopify refunds either ALL shipping (true) or none (false) — partial shipping amounts aren't supported. Pass the same value to `refundOrder`."
    refundShipping: Boolean!
    "Which method the suggested amount is allocated to: the original payment method(s) (default) or store credit. Store credit requires the order to have a customer and is not supported for B2B orders."
    refundMethodAllocation: RefundMethodAllocation = ORIGINAL_PAYMENT_METHODS
  ): SuggestedRefundResult @action(name: "suggested_refund")

  """
  Fetch metafields attached to one or more Shopify resources, given their GIDs.
  Accepts mixed owner types in a single call. Each returned owner includes its
  `typename`. Owners with no metafields are omitted from the result;
  unresolvable GIDs are surfaced as errors. Reference-type metafields are
  returned as their raw GID `value`; the referenced resources are not resolved.
  """
  getMetafieldsByOwnerId(
    """
    GIDs of resources to fetch metafields for. Up to 25 per call.
    """
    ownerIds: [ID!]!
    """
    Optional filter to specific metafields by `namespace.key` (e.g.
    `["custom.warranty_period", "global.title_tag"]`). When omitted, returns
    the first 50 metafields per owner.
    """
    keys: [String!]
  ): MetafieldsByOwnerIdResult @action(name: "get_metafields_by_owner_id")

  """
  Get live inventory for product variants, given product or variant GIDs.
  Answers "is this in stock?", "how many are left?", and "can the customer buy
  this online?". A variant GID returns that variant; a product GID returns its
  variants. Accepts product and variant GIDs mixed in one call.
  """
  getProductInventory(
    """
    Product and/or variant GIDs (`gid://shopify/Product/...` or
    `gid://shopify/ProductVariant/...`), mixed freely. Up to 25 per call.
    """
    ids: [ID!]!
  ): ProductInventoryResult @action(name: "get_product_inventory")

  """
  Resolve Shopify file GIDs to usable URLs — the image URL for an image, the
  document URL for a PDF. Use this to turn a file reference into something you
  can show or send to a customer.

  Retrieves a list of files that have been uploaded to a Shopify store.
  Files represent digital assets that merchants can upload to their store for various
  purposes including product images, marketing materials, documents, and brand assets.
  Note: this app does not have access to all file resources.
  """
  getFilesByIds(
    """
    File GIDs to resolve (`gid://shopify/MediaImage/...`,
    `gid://shopify/GenericFile/...`), mixed freely. Up to 25 per call.
    """
    ids: [ID!]!
  ): FilesByIdsResult @action(name: "get_files_by_ids")
}

type Mutation {
  """
  Cancels an order, with options for refunding, restocking inventory, and customer notification.
  Caution: Order cancellation is irreversible. An order that has been cancelled can't be restored to its original state.
  This is an asynchronous task and will return a jobId to track the status of the operation.

  An order can only be cancelled if it meets the following criteria:
  - The order hasn't already been cancelled.
  - The order has no pending payment authorizations.
  - The order has no active returns in progress.
  - The order has no outstanding fulfillments that can't be cancelled.
  """
  cancelOrder(
    """
    The ID of the order to be canceled, e.g. "gid://shopify/Order/4459950243991".
    """
    orderId: ID!

    """
    The reason for canceling the order.
    """
    reason: CancelOrderReason!

    """
    Indicates how to refund the amount paid by the customer. Authorized payments are voided
    regardless of this setting. Omit to issue no refund.
    """
    refundMethod: OrderCancelRefundMethodInput

    """
    Whether to restock the inventory committed to the order. For unpaid orders fulfilled from locations that have been deactivated, inventory will not be restocked to the deactivated locations even if this argument is set to true.
    """
    restock: Boolean!

    """
    A staff-facing note about the order cancellation. This is not visible to the customer. default: null
    """
    staffNote: String

    """
    Whether to send a notification to the customer about the order cancellation.
    """
    notifyCustomer: Boolean
  ): CancelOrderResult @action(name: "cancel_order")

  """
  Issue a refund for an order, using values from a `suggestedRefund` preview of the same order.

  - To the original payment method(s) (`refundMethod: ORIGINAL_PAYMENT_METHODS`, default): run
    `suggestedRefund` (with `refundMethodAllocation: ORIGINAL_PAYMENT_METHODS`) and pass its
    `refundLineItems` and `suggestedTransactions` as this action's `refundLineItems` and
    `transactions`.
  - To store credit (`refundMethod: STORE_CREDIT`): run `suggestedRefund` with
    `refundMethodAllocation: STORE_CREDIT` and pass its `amountSet` (presentment) as
    `storeCreditAmount`, with no `transactions`. Store credit requires the order to have a customer
    and is not supported for B2B orders.

  In both cases `currencyCode` is the order's presentment currency and `refundShipping` must match
  the value previewed with, or Shopify rejects the refund as an over-refund. Refunded items are not
  restocked. The refund is idempotent per execution, so a retried execution replays the original
  refund rather than issuing a duplicate.

  Refundable: order line items (the whole order or specific lines) and shipping, to the original
  payment method or store credit. Not refundable: duties and additional fees (not supported); and
  only CAPTURED amounts can be refunded — an authorized-but-uncaptured payment is cancelled via
  `cancel_order`, not refunded here.
  """
  refundOrder(
    "The order to refund, e.g. \"gid://shopify/Order/7462005375289\"."
    orderId: ID!
    "The order's presentment (customer) currency, e.g. \"USD\", so the refund settles in the original payment currency."
    currencyCode: String!
    "The line items to refund, each identified by its order line-item GID and the quantity to refund."
    refundLineItems: [RefundLineItemInput!]!
    "Where the refund is sent: the original payment method(s) (default) or store credit."
    refundMethod: RefundMethodAllocation = ORIGINAL_PAYMENT_METHODS
    "The payment transactions to reimburse when refunding to the original payment method, each identifying an original payment to refund against and the amount. Required for `ORIGINAL_PAYMENT_METHODS`; omit for `STORE_CREDIT`. With no transactions and no store credit, the refund records no money movement."
    transactions: [RefundOrderTransactionInput!]
    "The amount to issue as store credit, in the order's presentment currency — use `amountSet` (presentment) from a `suggestedRefund` preview run with `refundMethodAllocation: STORE_CREDIT`. Required when `refundMethod` is `STORE_CREDIT`; ignored otherwise."
    storeCreditAmount: Currency
    "Optional expiry for the issued store credit (ISO 8601, e.g. \"2027-01-15T00:00:00Z\"); must be in the future. Omit for store credit that never expires. Ignored unless `refundMethod` is `STORE_CREDIT`."
    storeCreditExpiresAt: DateTime
    "Whether to refund shipping in full. Required, and must match the value used in the order's `suggestedRefund` preview, or Shopify rejects the refund as an over-refund. Refunds either ALL shipping (true) or none (false) — partial shipping amounts aren't supported."
    refundShipping: Boolean!
    "An optional note recorded on the refund."
    note: String
    "Whether to email the customer about the refund. Default false."
    notify: Boolean = false
  ): RefundResult @action(name: "refund_order")

  """
  Update the shipping address on an order.
  """
  updateShippingAddress(
    "The ID of the order to update."
    orderId: ID!
    "The first line of the address."
    address1: String
    "The second line of the address."
    address2: String
    "The city of the address."
    city: String
    "The company of the person associated with the address."
    company: String
    "The two-letter code for the country of the address."
    countryCode: String
    """
    A unique phone number for the customer.
    Formatted using E.164 standard. For example, +16135551111.
    """
    phone: String
    "The two-letter code for the province or state of the address."
    provinceCode: String
    "The ZIP or postal code of the address."
    zip: String
    "The first name of the person associated with the address."
    firstName: String
    "The last name of the person associated with the address."
    lastName: String
  ): UpdateShippingAddressResult @action(name: "update_shipping_address")

  """
  Creates a draft order for a customer from line items. A draft order can be used to
  create an order on behalf of a customer.

  Provide catalog products as `productLineItems` and off-catalog items as
  `customLineItems`; at least one line item (of either kind) is required. Each line
  may carry an `appliedDiscount` (a 100% PERCENTAGE discount yields a $0 line for
  replacement orders).
  """
  createDraftOrderForCustomer(
    "The ID of the customer the draft order is placed for (e.g. `gid://shopify/Customer/123`)."
    customerId: ID!

    "Catalog product-variant line items."
    productLineItems: [DraftOrderProductLineItemInput!]

    "Off-catalog custom line items (e.g. a goodwill credit or made-to-order item)."
    customLineItems: [DraftOrderCustomLineItemInput!]

    """
    Lock the price of every catalog (product) line item to its current price so it won't
    change before the customer pays. When true, each product line is given a price override
    that snapshots today's catalog price; when false or omitted, product lines recalculate to
    the live catalog price at checkout — so the customer could be charged a different amount
    than was quoted if a price or sale changes in between.

    Rule of thumb: if this draft is a QUOTE or CONTRACT the customer will pay later (e.g. an
    emailed invoice via `send_draft_order_invoice`), set this true so the quoted prices hold.
    If it is a temporary cart that will be paid immediately and should reflect live pricing and
    discounts, leave it off. Affects catalog (product) lines only — custom line items already
    carry their own fixed price.
    """
    lockPrices: Boolean

    """
    An order-level discount applied to the whole order. A PERCENTAGE discount applies
    to the order subtotal; a FIXED_AMOUNT is taken off the order total. This is separate
    from and stacks with any per-line `appliedDiscount` on the line items.
    """
    appliedDiscount: DraftOrderAppliedDiscountInput

    """
    Set true to charge no tax on this order (e.g. a tax-exempt customer or a goodwill
    replacement). Omit for normal tax calculation based on the customer's address and
    product taxability. This exempts the whole order, separate from a custom line item's
    own `taxable` flag.
    """
    taxExempt: Boolean

    """
    An optional note attached to the draft order, e.g. the reason for the order
    ("Replacement for damaged order #1059").
    """
    note: String

    """
    Tags to attach to the draft order, for categorization and filtering.
    """
    tags: [String!]
  ): CreateDraftOrderResult @action(name: "create_draft_order_for_customer")

  """
  Updates basic fields on an existing draft order: the contact email, note, phone,
  purchase order number, and shipping address. Only the fields provided are changed;
  omitted fields are left untouched. At least one updatable field must be provided.

  This action does NOT change line items, discounts, tax settings, the customer, or
  any other draft-order field. It targets direct-to-customer (D2C) draft orders identified by
  `customerId`; updating B2B (company-owned) draft orders is out of scope — a company-owned draft
  has no matching customer and so trips the `customer_mismatch` alert. (B2B drafts still appear in
  the response's `purchasingEntity`; only updating them is unsupported.)

  The update always applies. If the updated draft turns out not to belong to `customerId`,
  the action still returns the updated draft and adds a non-fatal `alert` — it does not fail.
  """
  updateDraftOrder(
    "The ID of the draft order to update (e.g. `gid://shopify/DraftOrder/123`)."
    draftOrderId: ID!
    """
    The customer the draft order belongs to (e.g. `gid://shopify/Customer/123`).
    Used to confirm the update is applied to the right customer's draft: if the updated draft
    is not associated with this customer, the action still returns it but adds a non-fatal
    `alert` with code `customer_mismatch`.
    """
    customerId: ID!
    "The contact email used to send notifications for the draft order."
    email: String
    "An optional note attached to the draft order."
    note: String
    "The contact phone number for the draft order."
    phone: String
    "The purchase order number."
    poNumber: String
    "The shipping address for the draft order. Provided sub-fields replace the address."
    shippingAddress: MailingAddressInput
  ): UpdateDraftOrderResult @action(name: "update_draft_order")

  """
  Completes a draft order and converts it into a regular order. The order appears
  in the merchant's orders list, and the customer can be notified about their order.
  Completing a draft order reserves inventory for its line items, making them
  unavailable to other customers, so verify availability before completing.
  Returns a minimal summary of the created order plus a reference to the completed draft order.
  """
  completeDraftOrder(
    "The ID of the draft order to complete."
    draftOrderId: ID!

    """
    A channel definition handle used for sales channel attribution of the
    resulting order. If not specified, the sourceName will be 'gladly'.
    """
    sourceName: String

    """
    Whether the resulting order should be created with payment pending. Defaults
    to true: the order's financialStatus starts as PENDING and payment is
    collected later (e.g. by invoice or payment terms). Pass false to mark the
    order as paid on completion.
    """
    paymentPending: Boolean
  ): CompleteDraftOrderResult @action(name: "complete_draft_order")

  """
  Creates a draft order from an existing order, copying its line items.
  Useful for re-ordering or re-billing the same items. Each line item includes
  stock availability so agents can spot out-of-stock items before completing.

  IMPORTANT: the result is NOT necessarily an exact copy of the source order. Shopify does
  not specify what gets duplicated — so treat the new draft as a starting point, not a faithful
  duplicate. Some details may be dropped, for example discounts or payment terms.

  Line item prices reflect the product's CURRENT catalogue price, NOT the price paid on the
  source order. If a product's price has changed since the original order, the draft will use
  the new price. This is especially important to flag when the original order was placed at a
  promotional or historical price.

  Because of this, review the returned draft against the intent —
  especially anything that affects what the customer pays (discounts, payment terms,
  shipping, totals) and the line items themselves — and confirm the values with a
  team member.

  When proposing this action for review, identify the source order by its
  human-readable name (e.g. `#1059`) in addition to its `orderId` GID, so the
  approving team member can confirm which order is being duplicated from the
  proposed inputs alone.
  """
  createDraftOrderFromOrder(
    """
    The globally-unique ID of the order to duplicate (e.g. `gid://shopify/Order/123456789`).
    """
    orderId: ID!

    """
    The globally-unique ID of the customer the draft order is for (e.g.
    `gid://shopify/Customer/123`). The draft inherits the source order's customer, so the
    source order should belong to this customer. If the created draft is not associated with
    this customer, the action still returns the draft and adds a non-fatal `customer_mismatch`
    alert — it does not fail.
    """
    customerId: ID!
  ): CreateDraftOrderFromOrderResult
    @action(name: "create_draft_order_from_order")

  """
  Update writable order metadata (`tags`, `note`).

  Note that this action does NOT cover line items, shipping address, payment,
  customer data, or any other order field.
  """
  updateOrderMetadata(
    """
    The globally-unique ID of the order to update (e.g. `gid://shopify/Order/123456789`).
    """
    orderId: ID!

    """
    The complete desired tag set on the order. Shopify uses **set-replace** semantics:
    whatever array you pass becomes the new tag set in its entirety, e.g to remove a tag,
    pass the existing tags minus that one. Passing an empty array `[]` clears ALL tags on the order. Omitting
    this field leaves the existing tags untouched.
    """
    tags: [String!]

    """
    The complete desired note on the order. Replaces the current note. Passing an
    empty string `""` clears the note. Omitting this field (or passing `null`)
    leaves the existing note untouched.
    """
    note: String
  ): UpdateOrderMetadataResult @action(name: "update_order_metadata")

  """
  Send the customer an order invoice email for an unpaid order.
  """
  sendOrderInvoice(
    """
    The globally-unique ID of the order to send the invoice for (e.g. `gid://shopify/Order/123456789`).
    """
    orderId: ID!

    """
    The email address the invoice is sent to. When provided, this overrides the
    order's default recipient. Omitting this field (or passing `null`/empty)
    leaves Shopify to send the invoice to the order's default email address.
    """
    email: String
  ): OrderInvoiceSendResult @action(name: "send_order_invoice")

  """
  Email the customer an invoice for an OPEN draft order — a hosted Shopify checkout link the
  customer uses to pay themselves. Use this as the PAID alternative to `complete_draft_order`
  (which finalizes with no payment): after building the draft with `create_draft_order_for_customer`
  or `create_draft_order_from_order` (and optionally `update_draft_order`), send the invoice so the
  customer pays at checkout. Moves the draft from OPEN to INVOICE_SENT; the order is created by
  Shopify once the customer pays. Fails if the draft is already completed/paid, or if no recipient
  is available (the draft has no email and no `email` override is provided).
  """
  sendDraftOrderInvoice(
    """
    The globally-unique ID of the draft order to invoice (e.g. `gid://shopify/DraftOrder/123456789`).
    Must be an OPEN draft — completed/paid drafts are rejected.
    """
    draftOrderId: ID!

    """
    The email address the invoice is sent to. When provided, this overrides the recipient for THIS
    send only (it does not change the email stored on the draft). Omit (or pass `null`/empty) to send
    to the draft's own email or its attached customer's email (resolved live at send time). A
    recipient is required: if the draft has no email and no customer with an email, this must be set.
    """
    email: String
  ): DraftOrderInvoiceSendResult @action(name: "send_draft_order_invoice")

  """
  Creates an "amount off" discount that's applied on a cart and at checkout when a customer enters a code.
  Currently the action supports only a fixed amount off (not a percentage).
  The discount is:
  - a fixed amount off
  - applicable to one-time purchases only
  - single-use
  - scoped to one specific customer
  - cannot be combined with other discounts

  Using the `appliesTo` parameter you can narrow down what the discount can be redeemed against:
  - one or more collections (`collectionIds`),
  - specific products (`productIds`),
  - specific product variants (`productVariantIds`).
  By default the discount applies a fixed amount off the whole order.

  Note: the created discount currently cannot be applied to an order via the Shopify admin UI.
  """
  createOneTimeCustomerDiscount(
    """
    The discount code customers enter at checkout (e.g. `GG-SHOES-ABCDE`).
    Must be unique within the store.
    """
    code: String!

    """
    The merchant-facing name shown in the Shopify admin.
    """
    title: String!

    """
    The fixed amount taken off (e.g. `2.95`).
    """
    discountAmount: Currency!

    """
    The single customer eligible for the discount (e.g. `gid://shopify/Customer/123`).
    """
    customerId: ID!

    """
    When the discount becomes active, in ISO-8601 format. Omit to start the discount
    immediately (defaults to the current time).
    """
    startsAt: DateTime

    """
    When the discount expires, in ISO-8601 format. Omit for a discount with no end date.
    """
    endsAt: DateTime

    """
    The items the discount applies to (a collection, specific products/variants, or the
    whole order). Omit to apply the discount to the whole order (the default).
    """
    appliesTo: DiscountAppliesToInput
  ): CreateDiscountCodeResult @action(name: "create_one_time_customer_discount")
}
