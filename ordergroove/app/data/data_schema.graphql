  """
  Card-safe camelCase twin of `last_login`.
  """
  lastLogin: DateTime

}

type Query {
  customers: [Customer]
  subscriptions: [Subscription]
  items: [Item]
  products: [Product]
  """
  Top-level list of orders backed by the customer-scoped `orders` pull, so agent UI
  forms can bind formData to it. A form's formData.graphqlField must name a field on
  `type Query`; without this no form can offer an order picker, and every order-keyed
  action (cancelOrder, sendOrderNow, and the already-shipped skipSubscription) is
  reachable only via Team Assist or the API. Added 2.3.5.
  """
  orders: [Order]
}
