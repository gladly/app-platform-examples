# =============================================================================
#  Skio action surface
#
#  Every field below is callable identically by a human agent (through its
#  ui/forms/ entry) and by Gladly AI / Team Assist. No action is card-only and
#  no action is AI-only.
#
#  Shapes were taken from live introspection of Skio's GraphQL API, not from the
#  docs render (which documents 26 of 35 mutations). Skio input columns typed
#  `uuid` are declared `String` here and coerced by GraphQL on the way out;
#  every date field stays `String` because agents supply date-only values that
#  would fail DateTime coercion in the runtime.
# =============================================================================

"""
Additional details and context about the error.
"""
type SkioErrorExtensions {
  code: String!
  path: String
  detail: String
}

type SkioError {
  """
  The main error message provided by Skio.
  Example: "Lambda policy revoked"
  """
  message: String!
  extensions: SkioErrorExtensions
}

"""
A product represents an item that can be sold in your store.
"""
type Product {
  title: String
}

"""
A specific version of a product, like different sizes or colors
"""
type ProductVariant {
  title: String
  Product: Product
}

"""
A policy defines the frequency and rules for billing or delivery
"""
type Policy {
  id: String
  interval: String
  intervalCount: Int
  isMaxCycleV2: Boolean
  maxCycles: Int
  minCycles: Int
  createdAt: String
  updatedAt: String
}

"""
A line item in a subscription, representing one product variant being subscribed to
"""
type SubscriptionLine {
  id: String
  priceWithoutDiscount: Float
  quantity: Int
  isPrepaid: Boolean
  ordersRemaining: Int
  sellingPlanId: String
  ProductVariant: ProductVariant
}

"""
A subscription object containing key details.
Matches the structure needed by the getSubscriptionById action.
"""
type Subscription {
  id: String
  platformId: String
  storefrontUserId: String
  status: String
  currencyCode: String
  cyclesCompleted: Int
  createdAt: String
  updatedAt: String
  cancelledAt: String
  nextBillingDate: String
  SubscriptionLines: [SubscriptionLine]
  BillingPolicy: Policy
  DeliveryPolicy: Policy
}

# -----------------------------------------------------------------------------
#  Shared result shapes
# -----------------------------------------------------------------------------

"""
The result of a Skio write that reports only success or failure.
"""
type SkioWriteResult {
  """
  Whether Skio accepted the change.
  """
  ok: Boolean
  """
  The agent-facing translation of a Skio failure. Set whenever the call failed -
  either Skio returned an errors array or its own `ok: false` - and null on
  success. Four Skio errors misdirect the caller (they read as permissions or
  outage problems when the real cause is a wrong id or an inactive discount
  code), so those four are rewritten into what they actually mean; every other
  Skio message is passed through verbatim. Read this to the customer or act on
  it; `errors` carries the untranslated original.
  """
  errorMessage: String
  errors: [SkioError!]
}

"""
The result of a Skio write that returns a human-readable message alongside the
success flag. Skio's message is worth showing the agent verbatim - it names the
actor and the timestamp.
"""
type SkioMessageResult {
  message: String
  ok: Boolean
  """
  The agent-facing translation of a Skio failure. Set whenever the call failed -
  either Skio returned an errors array or its own `ok: false` - and null on
  success. Four Skio errors misdirect the caller (they read as permissions or
  outage problems when the real cause is a wrong id or an inactive discount
  code), so those four are rewritten into what they actually mean; every other
  Skio message is passed through verbatim. Read this to the customer or act on
  it; `errors` carries the untranslated original.
  """
  errorMessage: String
  errors: [SkioError!]
}

