  DeliveryPolicy: Policy
}
"""
A customer with their subscriptions.
"""
type CustomerWithSubscriptionsOutput {
  id: String
  email: String
  firstName: String
  lastName: String
  phoneNumber: String
  platformId: String
  createdAt: String
