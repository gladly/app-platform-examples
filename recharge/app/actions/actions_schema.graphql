# Enums
enum PurchaseItemType {
  subscription
  onetime
}

enum ChargeType {
  checkout
  recurring
}

enum ChargeStatus {
  success
  error
  queued
  skipped
  refunded
  partially_refunded
  pending_manual_payment
  pending
}

enum SubscriptionStatus {
  active
  cancelled
  expired
}

enum OrderInternalUnits {
  day
  week
  month
}

# Common Types
type Property {
  name: String!
  value: String!
}

type ExternalId {
  ecommerce: String
  payment_processor: String
}

type OrderAttribute {
  name: String
  value: String
}

type TaxLine {
  price: String
  rate: String
  title: String
}

type ShippingLine {
  code: String
  price: String
  source: String
  title: String
  taxable: String
  tax_lines: [TaxLine!]
}

type Images {
  large: String
  medium: String
  small: String
  original: String
}

type Address {
  address1: String
  address2: String
  city: String
  company: String
  country_code: String
  first_name: String
  last_name: String
  phone: String
  province: String
  zip: String
}

type ClientDetails {
  browser_ip: String
  user_agent: String
}

type Customer {
  id: ID!
  email: String
  external_customer_id: ExternalId
  hash: String
}

type RechargeError {
  http_status: Int!
  error_message: String
}

# Core Business Types

# The charge object > line_items: https://developer.rechargepayments.com/2021-11/charges/charge_object
type LineItem {
  purchase_item_id: ID # The Subscription/Onetime ID for a recurring item; null for a one-time free gift added via add_free_gift
  external_product_id: ExternalId
  external_variant_id: ExternalId
  grams: Int
  handle: String
  images: Images
  original_price: Currency
  properties: [Property!]
  purchase_item_type: PurchaseItemType
  quantity: Int
  sku: String
  tax_due: String
  tax_lines: [TaxLine!]
  taxable: Boolean
  taxable_amount: Currency
  title: String
  total_price: Currency
  unit_price: Currency
  unit_price_includes_tax: Boolean
  variant_title: String
}

# The charge object: https://developer.rechargepayments.com/2021-11/charges/charge_object
type Charge {
  id: ID!
  address_id: ID!
  billing_address: Address
  client_details: ClientDetails
  created_at: DateTime
  currency: String
  customer: Customer
  external_order_id: ExternalId
  external_transaction_id: ExternalId
  line_items: [LineItem!]
  note: String
  order_attributes: [OrderAttribute!]
  orders_count: Int
  payment_processor: String
  processed_at: DateTime
  scheduled_at: String
  shipping_address: Address
  shipping_lines: [ShippingLine!]
  status: ChargeStatus
  subtotal_price: Currency
  tags: String
  tax_lines: [TaxLine!]
  taxable: Boolean
  taxes_included: Boolean
  total_discounts: Currency
  total_line_items_price: Currency
  total_price: Currency
  total_refunds: Currency
  total_tax: Currency
  total_weight_grams: Int
  type: ChargeType
  updated_at: DateTime
}

# The subscription object: https://developer.rechargepayments.com/2021-11/subscriptions/subscriptions_object
type Subscription {
  id: ID!
  address_id: ID!
  customer_id: ID
  cancellation_reason: String
  cancellation_reason_comments: String
  cancelled_at: DateTime
  charge_interval_frequency: Int!
  created_at: DateTime
  expire_after_specific_number_of_charges: Int
  external_product_id: ExternalId!
  external_variant_id: ExternalId
  has_queued_charges: Boolean
  is_prepaid: Boolean
  is_skippable: Boolean
  is_swappable: Boolean
  max_retries_reached: Boolean
  order_day_of_month: Int
  order_day_of_week: Int
  order_interval_frequency: Int! # doc incorrectly specifies String, actual type is Int
  next_charge_scheduled_at: String
  order_interval_unit: OrderInternalUnits!
  presentment_currency: String
  price: Currency
  product_title: String
  properties: [Property!]
  quantity: Int!
  sku: String
  sku_override: Boolean
  status: SubscriptionStatus!
  updated_at: DateTime
  variant_title: String
}

# Response Types
#
# TIMESTAMP TYPING CONVENTION -- do not "fix" for consistency:
# Vendor-emitted RFC3339 timestamps may be DateTime; agent-supplied/echoed dates MUST be String.
# Each type's choice is FROZEN once shipped: appcfg compatible rejects DateTime<->String in
# either direction as a breaking schema change (verified against the 1.3.1 build). So
# Subscription/Charge/CreditAdjustment timestamps stay DateTime and CustomerAddress timestamps
# stay String -- both are correct; leave them as they are.
type SubscriptionActionResult {
  error: RechargeError
  subscription: Subscription
}

type SubscriptionSkipActionResult {
  error: RechargeError
  charge: Charge
}

# An address that carries its own id (distinct from the embedded `Address` type above, which is
# inlined under Charge.billing_address/shipping_address without an id). Returned by updateAddress.
# Timestamps are String (not DateTime) on this action-result type to avoid any runtime coercion risk.
type CustomerAddress {
  id: ID!
  customer_id: ID
  payment_method_id: ID
  address1: String
  address2: String
  city: String
  company: String
  country_code: String
  first_name: String
  last_name: String
  phone: String
  province: String
  zip: String
  created_at: String
  updated_at: String
}

type AddressActionResult {
  error: RechargeError
  address: CustomerAddress
}

enum CreditAdjustmentType {
  credit
  debit
}

# Consolidated-pair operations (see manageSubscriptionState / manageNextChargeSkip below).
enum SubscriptionStateOperation {
  cancel
  reactivate
}

enum NextChargeSkipOperation {
  skip
  unskip
}

enum ChargeDiscountOperation {
  apply
  remove
}

# The credit adjustment returned by adjust_credit. Money fields are Currency (the API returns
# decimal strings that coerce cleanly, verified live). Defined before CreditActionResult/Mutation.
type CreditAdjustment {
  id: ID!
  credit_account_id: ID!
  amount: Currency
  ending_balance: Currency
  currency_code: String
  type: String
  note: String
  created_at: DateTime
  updated_at: DateTime
}

type CreditActionResult {
  error: RechargeError
  credit_adjustment: CreditAdjustment
}

# API Token Scopes doc: https://developer.rechargepayments.com/2021-11/authentication
type Mutation {
  # Requires the 'write_subscriptions' scope to cancel a subscription
  cancelSubscription(
    subscriptionId: ID!
    reason: String # Optional, default: "Cancellation reason was not specified"
    sendEmail: Boolean # Optional, default: true
  ): SubscriptionActionResult! @action(name: "cancel_subscription")

  # Requires the 'write_subscriptions' scope to reactivate a subscription
  reactivateSubscription(subscriptionId: ID!): SubscriptionActionResult!
    @action(name: "reactivate_subscription")

  # Requires the 'write_orders' scope to skip a subscription (skip a charge)
  skipNextSubscription(
    subscriptionId: ID!
    chargeId: ID!
  ): SubscriptionSkipActionResult! @action(name: "skip_next_subscription")

  # Requires the 'write_orders' scope to unskip a subscription (unskip a charge)
  unskipNextSubscription(
    subscriptionId: ID!
    chargeId: ID!
  ): SubscriptionSkipActionResult! @action(name: "unskip_next_subscription")

  """
  Move a subscription's next charge to a later date. This only defers the next charge: it does
  NOT pause the subscription (its status is unchanged) and it clears any existing skip on that
  charge. resumeDate is the new charge date as a date-only string in YYYY-MM-DD format (e.g.
  2026-09-15) with no time or timezone, and must be a valid future charge date for the
  subscription (Recharge rejects a past or otherwise invalid date). Requires the
  'write_subscriptions' scope.
  """
  rescheduleNextCharge(
    subscriptionId: ID!
    resumeDate: String! # date-only (YYYY-MM-DD); String, not DateTime, so date-only values never fail coercion
  ): SubscriptionActionResult! @action(name: "reschedule_next_charge")

  """
  Change how often a subscription renews. Send all three of orderIntervalFrequency,
  orderIntervalUnit, and chargeIntervalFrequency together, and chargeIntervalFrequency MUST equal
  orderIntervalFrequency (a mismatch is rejected as "cannot change a regular subscription to
  prepaid"). Requires the 'write_subscriptions' scope.
  """
  changeSubscriptionFrequency(
    subscriptionId: ID!
    orderIntervalFrequency: Int!
    orderIntervalUnit: OrderInternalUnits!
    chargeIntervalFrequency: Int!
  ): SubscriptionActionResult! @action(name: "change_subscription_frequency")

  """
  Update a customer/subscription shipping address. Only the fields you supply are changed. If you
  change countryCode you MUST also supply a zip valid for the new country in the same call, or the
  update is rejected. Requires the 'write_customers' scope.
  """
  updateAddress(
    addressId: ID!
    address1: String
    address2: String
    city: String
    province: String
    zip: String
    countryCode: String
    firstName: String
    lastName: String
    phone: String
    company: String
  ): AddressActionResult! @action(name: "update_address")

  """
  Add a one-time free gift line item to a charge, identified by its Shopify external variant id.
  The target charge MUST be in QUEUED or ERROR status (a processed charge is rejected). quantity is
  required; price is optional. Requires the 'write_orders' scope.
  """
  addFreeGift(
    chargeId: ID!
    externalVariantId: ID!
    quantity: Int!
    price: String
  ): SubscriptionSkipActionResult! @action(name: "add_free_gift")

  """
  Add (type "credit") or remove (type "debit") store credit on a customer's credit account.
  Only adjust an amount the customer actually requested, after verifying their identity -- never
  choose an amount on the customer's behalf. amount must be a plain positive decimal (e.g. 10.00).
  This action is GUARDED: the agent must type "approve" in confirmationCopy and the amount must not
  exceed the merchant-configured maximum, or it is rejected without calling Recharge. Requires the
  credit read+write scope.
  """
  adjustCredit(
    creditAccountId: ID!
    amount: String!
    type: CreditAdjustmentType!
    note: String
    confirmationCopy: String!
  ): CreditActionResult! @action(name: "adjust_credit")

  """
  Apply a discount/coupon code to a charge. To discount a customer's next order, apply it to their
  queued charge. Requires the 'write_orders' scope.
  """
  applyDiscount(
    chargeId: ID!
    discountCode: String!
  ): SubscriptionSkipActionResult! @action(name: "apply_discount")

  """
  Remove a previously applied discount from a charge. NOT idempotent: removing when no discount is
  applied is rejected by Recharge (surfaced as an error, not a silent success). Requires the
  'write_orders' scope.
  """
  removeDiscount(
    chargeId: ID!
  ): SubscriptionSkipActionResult! @action(name: "remove_discount")

  """
  Swap a subscription's item to a different Shopify variant, identified by its external variant id.
  The subscription must be swappable (see is_swappable); one-time items are not swappable. Prepaid
  subscriptions additionally require an override and may be rejected -- have a manager handle those
  in Recharge. Recharge backfills the product/price/sku from the variant. The optional price field
  is capped by the same merchant-configured maximum as adjustSubscriptionPrice (rejected before
  calling Recharge), but -- unlike adjustSubscriptionPrice -- carries no typed-approval confirmation,
  so prefer leaving it unset and using adjustSubscriptionPrice instead. The agent form omits this
  field entirely (only AI/API callers can set it). Requires the 'write_subscriptions' scope.
  """
  swapSubscriptionItem(
    subscriptionId: ID!
    externalVariantId: ID!
    quantity: Int
    price: String
  ): SubscriptionActionResult! @action(name: "swap_subscription_item")

  """
  Set a subscription's line-item price. Only set a price the customer actually requested -- never
  choose one on their behalf. price must be a plain positive decimal (e.g. 12.00). This action is
  GUARDED: the agent must type "approve" in confirmationCopy and the price must not exceed the
  merchant-configured maximum, or it is rejected without calling Recharge. Requires the
  'write_subscriptions' scope.
  """
  adjustSubscriptionPrice(
    subscriptionId: ID!
    price: String!
    confirmationCopy: String!
  ): SubscriptionActionResult! @action(name: "adjust_subscription_price")

  """
  Cancel or reactivate a subscription -- pick the operation. reason and sendEmail are used only
  when operation is "cancel" (mirrors cancelSubscription's optional args) and are ignored when
  reactivating; sendEmail is "true"/"false" as a string, default "true". cancelSubscription,
  reactivateSubscription, skipNextSubscription, and unskipNextSubscription remain available
  unchanged for Gladly AI/API callers -- this mutation is the human-agent-facing equivalent for
  the cancel/reactivate pair, added instead of a compose-menu form per subscription/onetime item.
  Requires the 'write_subscriptions' scope.
  """
  manageSubscriptionState(
    subscriptionId: ID!
    operation: SubscriptionStateOperation!
    reason: String
    sendEmail: String
  ): SubscriptionActionResult! @action(name: "manage_subscription_state")

  """
  Skip or unskip a subscription's charge -- pick the operation. Requires both subscriptionId and
  chargeId, matching skipNextSubscription/unskipNextSubscription (which remain available
  unchanged for Gladly AI/API callers). This mutation is the human-agent-facing equivalent for the
  skip/unskip pair. Requires the 'write_orders' scope.
  """
  manageNextChargeSkip(
    subscriptionId: ID!
    chargeId: ID!
    operation: NextChargeSkipOperation!
  ): SubscriptionSkipActionResult! @action(name: "manage_next_charge_skip")

  """
  Apply or remove a discount on a charge -- pick the operation. discountCode is required when
  operation is "apply" and ignored when removing. applyDiscount and removeDiscount remain available
  unchanged for Gladly AI/API callers -- this mutation is the human-agent-facing equivalent for the
  apply/remove pair, added instead of two separate compose-menu forms. Removing a discount when none
  is applied is rejected by Recharge (surfaced as an error, not a silent success). Requires the
  'write_orders' scope. Returns the updated charge.
  """
  manageChargeDiscount(
    chargeId: ID!
    operation: ChargeDiscountOperation!
    discountCode: String
  ): SubscriptionSkipActionResult! @action(name: "manage_charge_discount")

  """
  Refund a charge, partially or fully. Provide EITHER amount (a partial refund of that dollar value)
  OR fullRefund "true" (refund the charge's entire remaining refundable balance) -- exactly one, not
  both. Only a charge processed through Recharge's own checkout can be refunded here; a charge
  processed through Shopify's checkout must be refunded in Shopify and is rejected by Recharge. This
  action is GUARDED: the agent must type "approve" in confirmationCopy, and the dollars actually
  refunded (amount for a partial, refundableAmount for a full) must not exceed the merchant-
  configured maximum, or it is rejected without calling Recharge. refundableAmount is the charge's
  remaining refundable balance (total_price minus total_refunds), supplied by the form. For a full
  refund it is BOTH the cap-checked figure AND the amount sent to Recharge: the request always sends
  an explicit `amount` (never Recharge's `full_refund` flag) so the dollars vetted against the cap
  are exactly the dollars refunded -- otherwise a caller could understate refundableAmount to slip a
  larger real refund past the cap. Because it is the amount sent, a stale/understated value simply
  under-refunds or is rejected by Recharge (recoverable), never over-refunds. fullRefund is
  "true"/"false" as a string (mirrors manageSubscriptionState.sendEmail) to avoid Boolean coercion
  from the form. Requires only the 'write_orders' scope -- the same scope the other charge actions
  use; Recharge's 2021-11 refund endpoint docs list "Scopes: write_orders" and no payments scope, so
  no additional Payments permission is needed. Returns the refunded charge.
  """
  refundCharge(
    chargeId: ID!
    amount: String
    fullRefund: String
    refundableAmount: String
    confirmationCopy: String!
  ): SubscriptionSkipActionResult! @action(name: "refund_charge")
}

type Query {
  # Requires the 'read_subscriptions' scope to view subscription details
  getSubscriptionById(subscriptionId: ID!): Subscription
    @action(name: "get_subscription_by_id")
}
