"""
Result of removing an item from an order. Ordergroove's DELETE endpoint defines no 200
response body at all, so this object is synthesised from the HTTP status - there is
nothing in the payload to echo back.
"""
type ItemDeletionResult {
  """
  True when Ordergroove accepted the deletion.
  """
  deleted: Boolean!
  """
  The item ID that was removed.
  """
  itemId: String!
  """
  Agent-facing summary of what happened.
  """
  message: String!
}

"""
A one-time incentive (discount) created for a single customer against one item or one
order. Ordergroove returns 201 Created with the incentive nested inside; the nested
object is flattened onto this type so nothing binds into a nullable nested value.
"""
type OneTimeDiscount {
  """
  Ordergroove's public ID for the incentive.
  """
  public_id: String
  """
  Card-safe camelCase twin of `public_id`.
  """
  publicId: String
  """
  The customer the discount belongs to.
  """
  customer: String
  """
  The item the discount applies to, if it was item-scoped.
  """
  item: String
  """
  The order the discount applies to, if it was order-scoped.
  """
  order: String
  """
  Merchant-supplied external code, if any.
  """
  externalCode: String
  """
  Free-text description recorded against the incentive.
  """
  description: String
  """
  Name recorded on the incentive - defaults to a customer-service goodwill label.
  """
  incentiveName: String
  """
  Either "Discount Percent" or "Discount Amount", as Ordergroove records it.
  """
  discountType: String
  """
  The discount value as a string, e.g. "5" for $5 off or "10" for 10% off.
  """
  discountValue: String
  """
  Either "item" or "order".
  """
  discountTarget: String
  """
  When the incentive was created.
  """
  created: DateTime
  """
  Card-safe camelCase twin of `last_updated`.
  """
  lastUpdated: DateTime
  """
  Agent-facing summary of what happened and what to tell the customer.
  """
  message: String
}

