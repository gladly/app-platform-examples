  prepaid_orders_remaining: Int
  """
  Number of orders included per prepaid billing period
  """
  prepaid_orders_per_billing: Int
  """
  Behavior when prepaid subscription renews (e.g., auto-renew, expire)
  """
  renewal_behavior: String
  """
  Revenue from last prepaid renewal
  """
  last_renewal_revenue: Float
  """
  Original merchant order ID that created the prepaid subscription
  """
  prepaid_origin_merchant_order_id: String
}

type CancellationReason {
  code: String!
  description: String!
}

type MerchantCancellationReason {
  """
  DEPRECATED - select `reasonCode` or `cancelReason` instead.

  This field is non-null but Ordergroove does not guarantee the underlying
  `cancel_reason` is numeric, so it cannot be populated for every row. It is
  populated when the vendor value is a plain integer and left unset otherwise;
  selecting it on a non-numeric row is a hard failure rather than a blank.

  It stays declared as `Int!` only because narrowing a shipped non-null field is a
  breaking schema change that the platform rejects on upgrade. Remove it in the next
  major.
  """
  code: Int!
  """
  Numeric cancellation reason code, or null when Ordergroove's value is not a plain
  integer. This is the nullable replacement for `code` and is safe to select on every
  row.
  """
  reasonCode: Int
  """
  The raw `cancel_reason` value exactly as Ordergroove returned it, for the cases where
  it is not a plain integer.
  """
  cancelReason: String
  application: String
}

type CancellationReasonResponse {
  """
  Standard cancellation reasons as described in https://help.ordergroove.com/hc/en-us/articles/360046017813-Subscriptions-Cancel-Reasons
  Ordergroove Subscription Manager themes have these 9 built-in cancellation reasons, pre-configured
  """
  standard_cancellation_reasons: [CancellationReason]
  """
  All cancellation reasons as described in https://help.ordergroove.com/hc/en-us/articles/360046017813-Subscriptions-Cancel-Reasons
  In addition to the standard 9 built-in, Ordergroove has additional Cancel Reasons available to use in the Subscription Manager.
  """
  all_cancellation_reasons: [CancellationReason]
  """
  Overview of all recorded reasons for cancellation per application.
  """
  merchant_cancellation_reasons: [MerchantCancellationReason]
}

